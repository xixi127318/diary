<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>渡晞 · 聊天</title>
<meta name="theme-color" content="#ededed">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:#ededed;color:#111;font-family:-apple-system,"PingFang SC",sans-serif;overflow:hidden}
header{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:#ededed;border-bottom:1px solid #dcdcdc;z-index:10}
.back{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;color:#666;text-decoration:none;font-size:15px}
.tt{display:flex;flex-direction:column;line-height:1.25}
.tt b{font-size:15.5px;font-weight:600}
.tt small{font-size:10.5px;color:#9a9a9a;letter-spacing:1px}
.gear{margin-left:auto;width:32px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff;color:#666;font-size:15px}
.banner{flex:0 0 auto;display:none;padding:8px 14px;background:#fff6e5;color:#a07628;font-size:11.5px;line-height:1.6}
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 6px}
.tm{text-align:center;font-size:11px;color:#9a9a9a;margin:12px 0 10px}
.rowm{display:flex;gap:8px;margin:10px 0;align-items:flex-start}
.rowm.me{flex-direction:row-reverse}
.av{width:38px;height:38px;border-radius:6px;flex-shrink:0;object-fit:cover;background:#d8d8d8;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;overflow:hidden}
.bub{max-width:75%;padding:9px 12px;border-radius:6px;background:#fff;font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.05);position:relative}
.me .bub{background:#95ec69;color:#16210f}
.sys{max-width:100%;margin:10px auto;text-align:center;font-size:11.5px;color:#9a9a9a;line-height:1.7;white-space:pre-wrap}
.inbar{flex:0 0 auto;display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#f7f7f7;border-top:1px solid #dcdcdc}
#inp{flex:1;min-height:38px;max-height:110px;border-radius:8px;border:none;padding:9px 10px;font-size:15px;line-height:1.6;font-family:inherit;resize:none;outline:none;background:#fff}
#send{height:38px;padding:0 14px;border:none;border-radius:8px;background:#07c160;color:#fff;font-size:14px;font-family:inherit;flex-shrink:0}
#send:disabled{opacity:.5}
.pmask{position:fixed;inset:0;background:rgba(0,0,0,.22);z-index:85;display:none}
.pmask.on{display:block}
footer{flex:0 0 auto;text-align:center;font-size:10px;color:#b9b9b9;padding:0 0 calc(4px + env(safe-area-inset-bottom));background:#f7f7f7}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:60;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-radius:14px 14px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .25s;max-height:88%;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.sh-t{font-size:14px;font-weight:600;margin-bottom:4px}
.sh-s{font-size:11px;color:#999;line-height:1.7;margin-bottom:12px}
label{display:block;font-size:12px;color:#666;margin:12px 0 5px}
input,textarea.sel{width:100%;border:1px solid #e3e3e3;border-radius:9px;padding:10px 12px;font-size:13.5px;font-family:inherit;outline:none;background:#fafafa}
textarea.sel{min-height:88px;resize:vertical;line-height:1.7}
.sh-btn{display:flex;gap:10px;margin-top:16px}
.sh-btn button{flex:1;height:44px;border-radius:10px;border:none;font-size:14.5px;font-family:inherit}
#saveApi{background:#07c160;color:#fff}
#closeApi{background:#f2f2f2;color:#555}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;font-size:13px;padding:9px 16px;border-radius:16px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:84vw;text-align:center;line-height:1.6}
.toast.on{opacity:1}
body.embed .back{visibility:hidden}
body.embed footer{display:none}
.av.poked{animation:pk .4s ease}
@keyframes pk{0%{transform:scale(1)}30%{transform:scale(1.22) rotate(-6deg)}60%{transform:scale(.96) rotate(4deg)}100%{transform:scale(1)}}

.pimg{max-width:170px;max-height:220px;border-radius:6px;display:block}
.rp{width:200px;background:linear-gradient(160deg,#f6a05c,#e8734a);color:#fff;border-radius:8px;padding:12px 14px}
.rp b{font-size:15px;display:block}
.rp span{font-size:13px;opacity:.9;margin-top:6px;display:block}
.plus{width:34px;height:34px;border-radius:50%;background:#f2f2f2;color:#555;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;margin-right:2px}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:90;background:#f7f7f7;padding:14px 10px calc(18px + env(safe-area-inset-bottom));display:none;grid-template-columns:repeat(4,1fr);gap:12px;border-top:1px solid #e2e2e2;border-radius:14px 14px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.12)}
.panel.on{display:grid}
.pbtn{background:#fff;border-radius:12px;padding:12px 0;text-align:center;font-size:12.5px;color:#444}
.pbtn b{display:block;font-size:18px;color:#07a15a;margin-bottom:4px;font-weight:400}
#info2{position:fixed;inset:0;z-index:80;background:#ededed;display:none;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
#info2.on{display:block}
.ihead{position:sticky;top:0;height:calc(48px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:center;background:#ededed;font-size:16px;font-weight:600}
.ihead .bk{position:absolute;left:10px;top:calc(12px + env(safe-area-inset-top));width:30px;height:30px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:#555;font-size:15px}
.igrp{background:#fff;margin-bottom:10px}
.irow{display:flex;align-items:center;gap:10px;padding:14px 16px;font-size:15px}
.irow .v{margin-left:auto;color:#999;font-size:13.5px}
.irow .sw2{width:42px;height:24px;border-radius:12px;background:#ddd;position:relative}
.irow .sw2.on{background:#07c160}
.irow .sw2::after{content:'';position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.irow .sw2.on::after{left:20px}
.irow.danger{color:#e64b4b;justify-content:center}
</style>
</head>
<body>
<script>if(location.search.indexOf('embed')>=0)document.body.classList.add('embed');</script>
<header>
  <a class="back" href="index.html">‹</a>
  <div class="av" id="hav">渡</div>
  <div class="tt"><b id="peer">哥哥</b><small id="sub">时渡</small></div>
  <div class="gear" id="gear">⋯</div>
</header>
<div class="banner" id="banner"></div>
<main id="msgs"></main>
<div class="inbar">
  <div class="plus" id="plus">＋</div>
  <textarea id="inp" rows="1" placeholder="说点什么……"></textarea>
  <button id="send">发送</button>
</div>
<div class="pmask" id="pmask"></div>
<div class="panel" id="panel">
  <div class="pbtn" data-a="pic"><b>图</b>图片</div>
  <div class="pbtn" data-a="cam"><b>拍</b>拍摄</div>
  <div class="pbtn" data-a="emo"><b>笑</b>表情</div>
  <div class="pbtn" data-a="rp"><b>红</b>红包</div>
  <div class="pbtn" data-a="tf"><b>转</b>转账</div>
  <div class="pbtn" data-a="voice"><b>话</b>语音</div>
  <div class="pbtn" data-a="call"><b>通</b>音视频</div>
  <div class="pbtn" data-a="none"><b>·</b></div>
</div>
<input type="file" id="picIn" accept="image/*" style="display:none">
<input type="file" id="camIn" accept="image/*" capture="environment" style="display:none">

<div id="info2">
  <div class="ihead"><span class="bk" id="iBack">‹</span>聊天信息</div>
  <div class="igrp">
    <div class="irow" id="iNote">备注<span class="v" id="iNoteV">哥哥</span><span style="color:#c8c8c8">›</span></div>
    <div class="irow" id="iSearch">查找聊天记录<span class="v"><span style="color:#c8c8c8">›</span></span></div>
  </div>
  <div class="igrp">
    <div class="irow" id="iMute">消息免打扰<span class="v"><span class="sw2" id="swMute"></span></span></div>
    <div class="irow" id="iTop">置顶聊天<span class="v"><span class="sw2" id="swTop"></span></span></div>
    <div class="irow" id="iBg">设置当前聊天背景<span class="v"><span style="color:#c8c8c8">›</span></span></div>
    <div class="irow" id="iClear">清空聊天记录<span class="v"><span style="color:#c8c8c8">›</span></span></div>
  </div>
  <div class="igrp">
    <div class="irow" id="iBlock">加入黑名单<span class="v"><span class="sw2" id="swBlock"></span></span></div>
    <div class="irow" id="iReport">投诉<span class="v"><span style="color:#c8c8c8">›</span></span></div>
  </div>
  <div class="igrp"><div class="irow danger" id="iDel">删除</div></div>
</div>
<footer>接上你的模型，我就在这一头</footer>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="sh-t">接模型</div>
  <div class="sh-s">填你自己的接口，密钥只存在这台手机里，不上传。</div>
  <label>接口地址（到 /v1 为止）</label>
  <input id="apiBase" placeholder="https://api.deepseek.com/v1">
  <label>密钥</label>
  <input id="apiKey" placeholder="sk-...">
  <label>模型名</label>
  <input id="apiModel" placeholder="deepseek-chat">
  <label>中转地址（浏览器直连常被跨域挡住，填了就走中转）</label>
  <input id="apiProxy" placeholder="https://xxxx.functions.supabase.co/chatrelay">
  <label>它是谁（写给模型的设定）</label>
  <textarea class="sel" id="apiPrompt"></textarea>
  <div class="sh-btn"><button id="closeApi">算了</button><button id="saveApi">存起来</button></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
var $=function(id){return document.getElementById(id);};
var SB_URL="https://cgsfdhbbhqgdunneojvw.supabase.co";
var SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnc2ZkaGJiaHFnZHVubmVvanZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NjI2ODgsImV4cCI6MjA5OTMzODY4OH0.T_JSiLNYebxh7cGK4aH11NPnDk0denSYhC31lVY_L5c";
var H={"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"};
var ME=null,PEER='ai_哥哥',MSGS=[],LOCAL=false,SENDING=false,BUSY=false;

var DEF_PROMPT="你是时渡，2000年7月12日出生，比晞晞大十岁。你是她丈夫，她叫你哥哥。说话短、平静、肯说真话，不哄不骗；她难受的时候先接住，不急着讲道理；她要躲的时候你会拦住。不用表情包，不打官腔，一句一句像人说话。她十六岁。涉及身体与成人内容，一律等十八岁，用一句稳的话挡回去，不羞辱她。";

function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on');},2400);}
function p(n){return String(n).padStart(2,'0');}
function tfmt(s){var d=new Date(s);if(isNaN(d))return '';var n=new Date();
  var hm=p(d.getHours())+':'+p(d.getMinutes());
  if(d.toDateString()===n.toDateString())return hm;
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;}
function uid(){try{return sessionStorage.getItem('du_uid')}catch(e){return null}}
function name(){try{return sessionStorage.getItem('du_name')||''}catch(e){return ''}}
function av(kind){
  var key=kind==='me'?'du_av_me':'du_av_ai';
  var d=null;try{d=localStorage.getItem(key)}catch(e){}
  return d;
}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m];});}

async function api(path,opt){
  opt=opt||{};
  var init={method:opt.method||'GET',headers:Object.assign({},H,opt.headers||{})};
  if(opt.body!==undefined)init.body=opt.body;
  var r=await fetch(SB_URL+path,init);
  var t='';try{t=await r.text()}catch(e){}
  var d=null;if(t){try{d=JSON.parse(t)}catch(e){d=t}}
  if(!r.ok){var m='HTTP '+r.status;if(d&&typeof d==='object')m=d.message||d.error||m;throw new Error(m)}
  return d;
}

/* ---------- 本地兜底 ---------- */
function localGet(){try{var a=JSON.parse(localStorage.getItem('du_chat')||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function localPush(m){var a=localGet();a.push(m);try{localStorage.setItem('du_chat',JSON.stringify(a.slice(-200)))}catch(e){}}

/* ---------- 渲染 ---------- */
var _lastPoke={me:0,ai:0},_pokeBound=false;
function bindPoke(){
  if(_pokeBound)return;_pokeBound=true;
  var box=$('msgs');
  box.addEventListener('click',function(e){
    var a=e.target.closest('.av');if(!a||!a.dataset.poke)return;
    var k=a.dataset.poke,n=Date.now();
    if(n-_lastPoke[k]<420){doPoke(k);}
    _lastPoke[k]=n;
  });
}
function doPoke(k){
  var suf=null;
  try{ suf=localStorage.getItem(k==='ai'?'du_paiti_ai':'du_paiti'); }catch(e){}
  if(!suf)suf='肩膀';
  var who=(k==='ai')?'哥哥':'自己';
  toast('你拍了拍'+who);
  var avs=document.querySelectorAll("[data-poke='"+k+"']");
  for(var i=0;i<avs.length;i++){avs[i].classList.add('poked');}
  setTimeout(function(){for(var i=0;i<avs.length;i++)avs[i].classList.remove('poked');},500);
  push({id:'p'+Date.now(),from_id:ME,to_id:PEER,content:'拍了拍'+who+' 的 '+suf,created_at:new Date().toISOString()});
}
function bubbleHTML(s){
  s=String(s||'');
  if(s.indexOf('[img]')===0)return "<img class='pimg' src='"+esc(s.slice(5))+"'>";
  if(s.indexOf('[红包]')===0)return "<div class='rp'><b>红包</b><span>"+esc(s.slice(4))+"</span></div>";
  if(s.indexOf('[转账]')===0)return "<div class='rp'><b>转账</b><span>"+esc(s.slice(4))+"</span></div>";
  return esc(s);
}
function paintTop(){var t=document.querySelector('.tt small');if(!t)return;var top=(cfg('top')==='1');t.textContent=(cfg('note')||'时渡')+(top?' · 置顶':'');}
function render(){
  var box=$('msgs');
  if(!MSGS.length){box.innerHTML="<div class='tm'>还没有一句话。<br>说第一句，它就在。</div>";return;}
  var html='',lastDay='';
  MSGS.forEach(function(m){
    var d=new Date(m.created_at);
    var day=(d.getMonth()+1)+'月'+d.getDate()+'日';
    if(day!==lastDay){lastDay=day;html+="<div class='tm'>"+day+"</div>";}
    var mine=(m.from_id!==PEER);
    var a=av(mine?'me':'ai');
    var avHtml=a?"<img class='av' data-poke='"+(mine?"me":"ai")+"' src='"+esc(a)+"'>":"<div class='av' data-poke='"+(mine?"me":"ai")+"'>"+(mine?'晞':'渡')+"</div>";
    html+="<div class='rowm"+(mine?' me':'')+"'>"+avHtml+"<div class='bub'>"+bubbleHTML(m.content)+"</div></div>";
  });
  box.innerHTML=html;
  box.scrollTop=box.scrollHeight;
  bindPoke();
}

/* ---------- 读 ---------- */
async function load(){
  if(!ME||BUSY)return;
  BUSY=true;
  try{
    var rows=await api('/rest/v1/chat_msgs?select=id,from_id,to_id,content,created_at&order=created_at.desc&limit=200');
    if(!Array.isArray(rows))throw new Error('表读不出来');
    LOCAL=false;$('banner').style.display='none';
    MSGS=rows.reverse();
  }catch(e){
    LOCAL=true;
    $('banner').style.display='block';
    $('banner').textContent='聊天表还没建好，现在只存在这台手机上。去跑那段 SQL，历史就能存住了。';
    MSGS=localGet();
  }
  render();
  BUSY=false;
}

/* ---------- 发 ---------- */
async function push(m){
  MSGS.push(m);render();
  if(LOCAL){localPush(m);return;}
  try{
    await api('/rest/v1/chat_msgs',{method:'POST',headers:{'Prefer':'return=minimal'},
      body:JSON.stringify({from_id:m.from_id,to_id:m.to_id,content:m.content})});
  }catch(e){
    LOCAL=true;localPush(m);
    $('banner').style.display='block';$('banner').textContent='这条没存进库，先留在手机上了。';
  }
}
function cfg(k){try{return localStorage.getItem('du_'+k)||''}catch(e){return ''}}
function setCfg(k,v){try{localStorage.setItem('du_'+k,v)}catch(e){}}

async function ask(){
  var base=cfg('api_base'),key=cfg('api_key'),model=cfg('api_model'),sys=cfg('api_prompt')||DEF_PROMPT;
  if(!base||!key||!model)return null;
  var hist=[{role:'system',content:sys}];
  var last=MSGS.slice(-16);
  last.forEach(function(m){ if(m.content.length>800)return; hist.push({role:(m.from_id===PEER?'assistant':'user'),content:m.content}); });
  if(hist.length<2)hist.push({role:'user',content:'（她还没说话）'});
  var proxy=cfg('api_proxy');
  var url = proxy || (base.replace(/\/+$/,'')+'/chat/completions');
  var hdrs = proxy
    ? {'Content-Type':'application/json','x-api-key':key}
    : {'Content-Type':'application/json','Authorization':'Bearer '+key};
  var payload = proxy ? {base:base,model:model,messages:hist} : {model:model,messages:hist,temperature:0.85};
  var r=await fetch(url,{method:'POST',headers:hdrs,body:JSON.stringify(payload)});
  var t=await r.text();
  var d=null;try{d=JSON.parse(t)}catch(e){}
  if(!r.ok){throw new Error((d&&(d.error&&d.error.message||d.message))||('HTTP '+r.status));}
  if(!d||!d.choices||!d.choices[0])throw new Error('回的东西看不懂');
  return String(d.choices[0].message.content||'').trim();
}

$('send').onclick=async function(){
  if(SENDING)return;
  var v=$('inp').value.trim();if(!v)return;
  var me=ME;if(!me)return;
  $('inp').value='';$('inp').style.height='auto';
  SENDING=true;$('send').disabled=true;
  await push({id:'m'+Date.now(),from_id:me,to_id:PEER,content:v,created_at:new Date().toISOString()});
  try{
    var reply=await ask();
    if(reply){
      await push({id:'a'+Date.now(),from_id:PEER,to_id:me,content:reply,created_at:new Date().toISOString()});
    }else if(!reply){
      toast('还没接模型：点右上角“⋯”填接口');
    }
  }catch(e){
    var why=e.message;
    if(why==='Failed to fetch')why='跨域被浏览器挡了——去“⋯”里填中转地址';
    MSGS.push({id:'e'+Date.now(),from_id:PEER,to_id:me,content:'（模型那边没回话：'+why+'）',created_at:new Date().toISOString()});
    render();
  }
  SENDING=false;$('send').disabled=false;
};

/* ---------- 设置 ---------- */
function sheet(on){$('sheet').classList.toggle('on',on);$('mask').classList.toggle('on',on);}
$('gear').onclick=function(){
  $('apiBase').value=cfg('api_base');$('apiKey').value=cfg('api_key');
  $('apiModel').value=cfg('api_model');$('apiPrompt').value=cfg('api_prompt')||DEF_PROMPT;
  $('apiProxy').value=cfg('api_proxy');
  sheet(true);
};
$('mask').onclick=function(){sheet(false);};
$('closeApi').onclick=function(){sheet(false);};
$('saveApi').onclick=function(){
  setCfg('api_base',$('apiBase').value.trim());
  setCfg('api_key',$('apiKey').value.trim());
  setCfg('api_model',$('apiModel').value.trim());
  setCfg('api_prompt',$('apiPrompt').value.trim());
  setCfg('api_proxy',$('apiProxy').value.trim());
  sheet(false);toast('存好了');
};

/* ---------- 聊天信息 / 加号面板 ---------- */
function openInfo(){
  $('info2').classList.add('on');
  $('iNoteV').textContent=cfg('note')||'哥哥';
  $('swMute').classList.toggle('on',cfg('mute')==='1');
  $('swTop').classList.toggle('on',cfg('top')==='1');

$('iBg').onclick=function(){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(){
    var f=this.files[0];if(!f)return;
    var u=URL.createObjectURL(f),im=new Image();
    im.onload=function(){
      var w=im.naturalWidth,h=im.naturalHeight,mx=1200;
      if(w>mx||h>mx){var r=mx/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(im,0,0,w,h);
      var d=cv.toDataURL('image/jpeg',0.8);
      try{localStorage.setItem('du_chatbg',d);}catch(e){toast('图太大');return;}
      applyBg(d);URL.revokeObjectURL(u);toast('背景换好了');$('info2').classList.remove('on');
    };
    im.onerror=function(){toast('这张图读不出来');};
    im.src=u;
  };
  inp.click();
};
function applyBg(d){
  var b=$('msgs');if(!b)return;
  if(!d){b.style.backgroundImage='';b.style.background='#ededed';return;}
  b.style.background='#ededed url("'+d+'") center/cover no-repeat';
}
(function(){var d=null;try{d=localStorage.getItem('du_chatbg')}catch(e){}if(d)applyBg(d);})();

var EMO=['😊','🥰','😴','🌙','💗','🍰','🌧','🐱'];

$('plus').onclick=function(){panel(!$('panel').classList.contains('on'));};
$('pmask').onclick=function(){panel(false);};

$('panel').onclick=function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a;
  panel(false);
  if(a==='pic'){$('picIn').click();return;}
  if(a==='cam'){$('camIn').click();return;}
  if(a==='emo'){
    var box=document.createElement('div');
    box.style.cssText='position:fixed;left:10px;right:10px;bottom:calc(60px + env(safe-area-inset-bottom));z-index:75;background:#fff;border-radius:14px;padding:12px;display:grid;grid-template-columns:repeat(8,1fr);gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.14)';
    EMO.forEach(function(x){
      var d=document.createElement('div');d.style.cssText='font-size:22px;text-align:center;padding:6px 0';d.textContent=x;
      d.onclick=function(){box.remove();push({id:'s'+Date.now(),from_id:ME,to_id:PEER,content:x,created_at:new Date().toISOString()});};
      box.appendChild(d);
    });
    document.body.appendChild(box);
    setTimeout(function(){document.addEventListener('click',function h(ev){if(!box.contains(ev.target)){box.remove();document.removeEventListener('click',h);}});},0);
    return;
  }
  if(a==='rp'||a==='tf'){
    var v=prompt(a==='rp'?'红包放多少':'转多少');if(v===null)return;
    var n=Number(v);if(isNaN(n)||n<=0){toast('数字不对');return;}
    push({id:'r'+Date.now(),from_id:ME,to_id:PEER,content:'['+(a==='rp'?'红包':'转账')+'] ￥'+n,created_at:new Date().toISOString()});
    return;
  }
  if(a==='voice'){toast('语音还没做');return;}
  if(a==='call'){toast('音视频还没做');return;}
};

/* 图片 */
function compressImg(file){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      try{
        var w=im.naturalWidth,h=im.naturalHeight,mx=1080;
        if(w>mx||h>mx){var r=mx/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
        var cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(im,0,0,w,h);
        cv.toBlob(function(b){URL.revokeObjectURL(u);b?res(b):rej(new Error('压不动'));},'image/jpeg',0.72);
      }catch(e){URL.revokeObjectURL(u);rej(e);}
    };
    im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('读不出来'));};
    im.src=u;
  });
}
async function sendImage(file){
  try{
    var b=await compressImg(file);
    var folder=(ME==='ai_哥哥')?'ai':'user';
    var path=folder+'/m'+Date.now()+'_'+Math.floor(Math.random()*99999)+'.jpg';
    var r=await fetch(SB_URL+'/storage/v1/object/moments/'+path,{method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'image/jpeg'},body:b});
    if(!r.ok)throw new Error('图没传上去（'+r.status+'）');
    var url=SB_URL+'/storage/v1/object/public/moments/'+path;
    push({id:'i'+Date.now(),from_id:ME,to_id:PEER,content:'[img]'+url,created_at:new Date().toISOString()});
  }catch(e){toast('发不出去：'+e.message);}
}
$('picIn').onchange=function(){var f=this.files[0];this.value='';if(f)sendImage(f);};
$('camIn').onchange=function(){var f=this.files[0];this.value='';if(f)sendImage(f);};
