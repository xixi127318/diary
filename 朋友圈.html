<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>渡晞 · 朋友圈</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="渡晞">
<meta name="theme-color" content="#fffafc">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--pink:#f7d6e0;--rose:#e8a0b8;--deep:#b5657f;--ink:#5a4550;--ink2:#8f7883;--line:#f2dde5;--lilac:#e6dcf7}
body{margin:0;font-family:-apple-system,"PingFang SC","Songti SC","Noto Serif CJK SC",serif;color:var(--ink);min-height:100vh;background:radial-gradient(circle at 10% 6%,#ffe9f2 0%,transparent 45%),radial-gradient(circle at 90% 20%,#efe4fb 0%,transparent 42%),radial-gradient(circle at 50% 100%,#fff2f6 0%,transparent 60%),#fffafc;background-attachment:fixed}
.wrap{max-width:680px;margin:0 auto;padding:0 0 92px}
header{position:sticky;top:0;z-index:50;padding:15px 20px 12px;background:linear-gradient(180deg,rgba(255,250,252,.97) 70%,rgba(255,250,252,.6));backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:9px}
.brand{font-size:18px;letter-spacing:3px;color:var(--deep);font-weight:600}
.brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--ink2);font-family:-apple-system,sans-serif;margin-top:3px;font-weight:400}
.go{font-size:11.5px;color:#c8a2b3;text-decoration:none;padding:4px 9px;border:1px solid var(--line);border-radius:12px;background:#fff;font-family:-apple-system,sans-serif;letter-spacing:1px}
.who{margin-left:auto;font-size:12px;color:var(--deep);background:#fff;border:1px solid var(--pink);border-radius:16px;padding:5px 12px;cursor:pointer;box-shadow:0 2px 8px rgba(232,160,184,.16);font-family:-apple-system,sans-serif}
.fresh{width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid var(--pink);color:#c08fa4;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;font-family:-apple-system,sans-serif}
.moment{margin:14px 16px 0;padding:16px 18px 14px;border-radius:22px;background:rgba(255,255,255,.9);border:1px solid var(--line);box-shadow:0 6px 20px rgba(232,160,184,.12);overflow:hidden}
.moment:active{transform:scale(.99)}
.mhead{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink2);margin-bottom:10px;font-family:-apple-system,sans-serif;flex-wrap:wrap}
.tag{font-size:10.5px;padding:3px 10px;border-radius:10px;background:#fdeef4;color:#c07a96;letter-spacing:.5px}
.tag.mine{background:#fff3e6;color:#c08f56}
.mtext{font-size:15px;line-height:1.95;color:#6a4f5c;white-space:pre-wrap;word-break:break-word;letter-spacing:.3px;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.imgs{display:grid;gap:6px;margin-top:11px}
.imgs.g2{grid-template-columns:1fr 1fr}
.imgs img{width:100%;display:block;border-radius:14px;background:#f6ecf0;object-fit:cover;border:1px solid #f7e6ee}
.imgs.g1 img{max-height:52vh;object-fit:contain;background:#fff}
.imgs.g2 img{height:38vw;max-height:170px}
.cnum{margin-top:10px;font-size:11px;color:#c9a8b6;font-family:-apple-system,sans-serif}
.empty{text-align:center;padding:70px 24px;color:#c4a8b6;font-size:13.5px;line-height:2;font-family:-apple-system,sans-serif}
#detail,#compose{display:none}
#detail{padding:20px 20px 30px}
.back{font-size:13px;color:#c08fa4;padding:6px 0 16px;cursor:pointer;display:inline-block;font-family:-apple-system,sans-serif}
.dhead{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink2);margin-bottom:14px;font-family:-apple-system,sans-serif;flex-wrap:wrap}
.delbtn{margin-left:auto;font-size:11px;color:#d19aae;border:1px solid #f5dde6;padding:4px 11px;border-radius:10px;background:#fff}
.dbody{font-size:15.5px;line-height:2.15;color:#6a4f5c;white-space:pre-wrap;word-break:break-word;letter-spacing:.3px}
.divide{display:flex;align-items:center;gap:12px;margin:30px 0 16px;color:#dcc2ce;font-size:11px;letter-spacing:3px;font-family:-apple-system,sans-serif}
.divide::before,.divide::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.hyphen{font-size:12.5px;color:#c9a8b6;padding:0 2px 8px;font-family:-apple-system,sans-serif;line-height:1.8}
.cmt{margin:0 0 12px;padding:14px 16px;border-radius:16px;background:rgba(255,240,246,.72);border:1px solid #fae3ec}
.cmt.mine{background:rgba(255,246,235,.8);border-color:#f8e8d6}
.cmt .ch{font-size:11px;color:#c08fa4;margin-bottom:7px;display:flex;gap:8px;font-family:-apple-system,sans-serif;align-items:center;flex-wrap:wrap}
.cmt .cb{font-size:14px;line-height:1.9;color:#7d606c;white-space:pre-wrap;word-break:break-word}
.cdel{margin-left:auto;font-size:10.5px;color:#d6b3c0;padding:0 4px}
.cbox{margin-top:14px;display:flex;gap:9px;align-items:flex-end}
.cbox textarea{flex:1;min-height:52px;max-height:150px;border:1px solid var(--pink);background:#fff;border-radius:16px;padding:12px 14px;font-size:14px;font-family:inherit;color:var(--ink);outline:none;resize:none;line-height:1.7}
.cbtn{width:52px;height:52px;border:none;border-radius:16px;flex-shrink:0;background:linear-gradient(135deg,#ffd0e0,#f0d4ff);color:#a8546f;font-size:18px}
.cbtn:disabled{opacity:.55}
#compose{padding:20px}
#mText{width:100%;min-height:28vh;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:18px;padding:15px 16px;font-size:15.5px;font-family:inherit;outline:none;line-height:2;resize:vertical}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pk{position:relative;width:76px;height:76px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff}
.pk img{width:100%;height:100%;object-fit:cover;display:block}
.pk .x{position:absolute;right:3px;top:3px;width:19px;height:19px;border-radius:50%;background:rgba(60,45,55,.68);color:#fff;font-size:11px;line-height:19px;text-align:center;font-family:-apple-system,sans-serif}
.add{width:76px;height:76px;border-radius:14px;border:1px dashed #eccbd8;background:#fff;color:#d3a8ba;font-size:24px;display:flex;align-items:center;justify-content:center;font-family:-apple-system,sans-serif}
.tip{font-size:11px;color:#c9a8b6;margin-top:9px;font-family:-apple-system,sans-serif}
.onlyme{display:flex;align-items:center;gap:9px;margin-top:12px;padding:8px 4px;font-size:13px;color:#8f7883;font-family:-apple-system,sans-serif}
.onlyme .sw{width:38px;height:22px;border-radius:12px;background:#f0e3ea;position:relative;flex-shrink:0}
.onlyme .sw::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.onlyme.on{color:#b5657f}
.onlyme.on .sw{background:linear-gradient(135deg,#ffd0e0,#e6d4ff)}
.onlyme.on .sw::after{left:18px}
.send{margin-top:14px;width:100%;height:54px;border:none;border-radius:18px;background:linear-gradient(135deg,#ffd3e2,#efd6ff,#ffe4d3);color:#9c4a68;font-size:16px;font-weight:600;font-family:inherit;letter-spacing:2px}
.send:disabled{opacity:.55}
nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;padding:9px 0 15px;background:linear-gradient(0deg,rgba(255,250,252,.99),rgba(255,250,252,.86));backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav div{flex:1;text-align:center;font-size:11.5px;color:#c4a8b6;padding:5px 0;font-family:-apple-system,sans-serif;letter-spacing:1px}
nav div.on{color:#b5657f;font-weight:500}
nav div i{display:block;font-size:18px;font-style:normal;margin-bottom:3px}
#login{padding:56px 26px;text-align:center}
#login .lock{font-size:34px;margin-bottom:16px}
#login h2{font-size:17px;color:#a8546f;margin:0 0 8px;letter-spacing:2px;font-family:-apple-system,sans-serif}
#login p{font-size:12px;color:#c4a8b6;margin:0 0 26px;letter-spacing:1px;font-family:-apple-system,sans-serif}
.pin{display:flex;justify-content:center;gap:14px;margin-bottom:26px}
.pin div{width:52px;height:62px;border-radius:18px;border:1.5px solid #f7dde8;display:flex;align-items:center;justify-content:center;font-size:22px;color:#c07a96;background:#fff}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;max-width:274px;margin:0 auto}
#pad b{height:56px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;color:#8f6a7c;border:1px solid var(--line);font-family:-apple-system,sans-serif}
#pad b:active{background:#fff0f6;transform:scale(.95)}
#pad b.fn{font-size:13px;color:#c4a8b6}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(90,69,80,.94);color:#fff5f8;font-size:13px;padding:11px 20px;border-radius:20px;opacity:0;transition:.28s;pointer-events:none;z-index:99;max-width:86vw;text-align:center;font-family:-apple-system,sans-serif;line-height:1.6}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr" style="display:none">
    <div class="toprow">
      <div class="brand">渡晞<small>朋友圈　时渡 与 张映晞</small></div>
      <a class="go" href="index.html">‹ 日记</a>
      <div class="who" id="who"></div>
      <div class="fresh" id="fresh">↻</div>
    </div>
  </header>

  <div id="login">
    <div class="lock">🎀</div>
    <h2>输入密码</h2>
    <p>这边只写给我们两个人看</p>
    <div class="pin" id="pinbox"><div></div><div></div><div></div><div></div></div>
    <div id="pad">
      <b>1</b><b>2</b><b>3</b>
      <b>4</b><b>5</b><b>6</b>
      <b>7</b><b>8</b><b>9</b>
      <b class="fn" data-act="clear">清空</b><b>0</b><b class="fn" data-act="del">删</b>
    </div>
  </div>

  <main id="feed"></main>

  <div id="detail">
    <span class="back" id="backD">‹ 回去</span>
    <div class="dhead"><span class="tag" id="dName"></span><span id="dTime"></span><span class="delbtn" id="delM" style="display:none">删掉</span></div>
    <div class="dbody" id="dBody"></div>
    <div id="dImgs"></div>
    <div class="divide">回应</div>
    <div id="cmts"></div>
    <div class="cbox">
      <textarea id="cInput" placeholder="说一句……"></textarea>
      <button class="cbtn" id="cSend">➤</button>
    </div>
  </div>

  <div id="compose">
    <span class="back" id="backC">‹ 回去</span>
    <textarea id="mText" placeholder="今天想发点什么……"></textarea>
    <div class="picks" id="picks"></div>
    <div class="tip">最多四张，传之前会压小一点</div>
    <div class="onlyme" id="onlyme"><span class="sw"></span>只给自己看</div>
    <button class="send" id="postBtn">发出去</button>
  </div>
</div>

<nav id="nav">
  <div class="on" data-tab="feed"><i>❀</i>朋友圈</div>
  <div data-tab="write"><i>✎</i>发一条</div>
</nav>

<input type="file" id="fileIn" accept="image/*" multiple style="display:none">
<div class="toast" id="toast"></div>

<script>
const SB_URL="https://cgsfdhbbhqgdunneojvw.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnc2ZkaGJiaHFnZHVubmVvanZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NjI2ODgsImV4cCI6MjA5OTMzODY4OH0.T_JSiLNYebxh7cGK4aH11NPnDk0denSYhC31lVY_L5c";
const H={"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"};
const ENC={"ai_哥哥":"哥哥","user_晞晞":"晞晞"};
const $=id=>document.getElementById(id);

let ME=null,PIN="",MOMS=[],CMTS=[],CUR=null,PEND=[],VIEW="login",BUSY=false,LY=0;

function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600);}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function pd(iso){if(!iso)return null;let s=String(iso).trim().replace(' ','T');
  s=s.replace(/(\.\d{3})\d+(Z|[+-]\d{2}:?\d{2})?$/, '$1$2');
  let d=new Date(s); if(isNaN(d))d=new Date(iso); return isNaN(d)?null:d;}
function fmt(iso){const d=pd(iso);if(!d)return '';const n=new Date(),p=x=>String(x).padStart(2,'0');
  return d.toDateString()===n.toDateString()?('今天 '+p(d.getHours())+':'+p(d.getMinutes()))
   :(d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()));}
function who(uid){return (ME&&uid===ME.id)?'我':(ENC[uid]||'他');}
function show(v){VIEW=v;['feed','detail','compose'].forEach(x=>$(x).style.display=x===v?'block':'none');
  $('hdr').style.display=v==='feed'?'block':'none';window.scrollTo(0,0);}
function setNav(t){document.querySelectorAll('nav div').forEach(d=>d.classList.toggle('on',d.dataset.tab===t));}

async function api(path,opt){
  opt=opt||{};
  const init={method:opt.method||'GET',headers:Object.assign({},H,opt.headers||{})};
  if(opt.body!==undefined)init.body=opt.body;
  let r;
  try{r=await fetch(SB_URL+path,init);}catch(e){throw new Error('连不上，看看网络');}
  let t='';try{t=await r.text();}catch(e){}
  let d=null;if(t){try{d=JSON.parse(t);}catch(e){d=t;}}
  if(!r.ok){
    let m='HTTP '+r.status;
    if(d&&typeof d==='object')m=d.message||d.error_description||d.error||d.hint||m;
    else if(typeof d==='string'&&d)m=d.slice(0,80);
    throw new Error(m);
  }
  return d;
}

/* ---------- 登录 ---------- */
$('pad').addEventListener('click',e=>{const b=e.target.closest('b');if(!b)return;
  const a=b.dataset.act;
  if(a==='clear'){PIN='';drawPin();return;}
  if(a==='del'){PIN=PIN.slice(0,-1);drawPin();return;}
  if(PIN.length>=4)return;
  PIN+=b.textContent.trim();drawPin();
  if(PIN.length===4)setTimeout(doLogin,140);});
function drawPin(){document.querySelectorAll('#pinbox div').forEach((d,i)=>{d.textContent=i<PIN.length?'●':'';d.classList.toggle('on',i===PIN.length);});}
async function doLogin(){
  const trying=PIN;
  try{
    const a=await api('/rest/v1/diary_users?select=id,nickname&password=eq.'+encodeURIComponent(trying));
    if(!Array.isArray(a))throw new Error('库回了看不懂的东西');
    if(!a.length){PIN='';drawPin();try{localStorage.removeItem('diary_pin');}catch(e){}toast('密码不对哦');return;}
    ME=a[0];try{localStorage.setItem('diary_pin',trying);}catch(e){}enter();
  }catch(e){PIN='';drawPin();toast(e.message||'连不上');}
}
function enter(){
  $('login').style.display='none';$('nav').style.display='flex';
  $('who').textContent=ENC[ME.id]||ME.nickname||ME.id;
  $('who').onclick=()=>{if(confirm('要换个身份吗？（会清掉记住的密码）')){try{localStorage.removeItem('diary_pin');}catch(e){}location.reload();}};
  show('feed');loadFeed();
}

/* ---------- 列表 ---------- */
async function loadFeed(silent){
  if(!ME||BUSY)return;BUSY=true;
  if(!silent&&!MOMS.length&&VIEW==='feed')$('feed').innerHTML="<div class='empty'>翻着……</div>";
  try{
    const m=await api('/rest/v1/diary_moments?select=id,user_id,content,images,created_at,private&order=created_at.desc&limit=40');
    const c=await api('/rest/v1/moment_comments?select=id,moment_id&limit=500').catch(()=>[]);
    if(!Array.isArray(m))throw new Error('朋友圈那张表还没建好');
    MOMS=m;CMTS=Array.isArray(c)?c:[];
    if(VIEW==='feed')renderFeed();
  }catch(e){
    if(VIEW==='feed'){
      if(MOMS.length){renderFeed();toast('没刷新上：'+e.message);}
      else{
        $('feed').innerHTML="<div class='empty'>翻不开："+esc(e.message)+"<br><br><span style='color:#c08fa4;text-decoration:underline' id='retry'>再试一次</span></div>";
        $('retry').onclick=()=>{MOMS=[];loadFeed();};
      }
    }
  }finally{BUSY=false;}
}
function imgsOf(m){let v=m&&m.images;if(typeof v==='string'){try{v=JSON.parse(v);}catch(e){v=[];}}return Array.isArray(v)?v:[];}
function imgsHTML(list,cap){const a=(Array.isArray(list)?list:[]).slice(0,cap||4);if(!a.length)return '';
  const g=a.length===1?'g1':'g2';
  return "<div class='imgs "+g+"'>"+a.map(u=>"<img loading='lazy' src='"+esc(u)+"'>").join('')+"</div>";}
function renderFeed(){
  if(!ME||VIEW!=='feed')return;
  const box=$('feed'),cnt={};
  CMTS.forEach(c=>{const k=String(c.moment_id);cnt[k]=(cnt[k]||0)+1;});
  const posts=MOMS.filter(m=>!(m.private&&m.user_id!==ME.id));
  if(!posts.length){box.innerHTML="<div class='empty'>"+(MOMS.length?'这边还没有。':'还没有一条。<br>去发第一条吧。')+"</div>";return;}
  box.innerHTML='';
  posts.forEach(m=>{
    const mine=m.user_id===ME.id,n=cnt[String(m.id)]||0;
    const d=document.createElement('div');d.className='moment';
    d.innerHTML="<div class='mhead'><span class='tag "+(mine?'mine':'')+"'>"+esc(who(m.user_id))+"</span><span>"+esc(fmt(m.created_at))+"</span></div>"
      +(m.content?"<div class='mtext'>"+esc(m.content)+"</div>":'')
      +imgsHTML(imgsOf(m),4)
      +(n?"<div class='cnum'>💬 "+n+" 条回应</div>":'');
    d.onclick=()=>openMoment(m);
    box.appendChild(d);
  });
}

/* ---------- 详情 ---------- */
async function openMoment(m){
  CUR=m;LY=window.scrollY;
  $('dName').textContent=who(m.user_id);
  $('dTime').textContent=fmt(m.created_at);
  $('dBody').textContent=m.content||'';
  $('dImgs').innerHTML=imgsHTML(imgsOf(m),9);
  $('delM').style.display=(m.user_id===ME.id)?'inline-block':'none';
  $('cInput').value='';$('cmts').innerHTML="<div class='hyphen'>翻着……</div>";
  show('detail');
  await loadCmts(m.id);
}
async function loadCmts(id){
  try{
    const d=await api('/rest/v1/moment_comments?select=id,moment_id,user_id,content,created_at&moment_id=eq.'+encodeURIComponent(id)+'&order=created_at.asc&limit=300');
    if(!Array.isArray(d))throw new Error('回应读不出来');
    CMTS=d;renderCmts();
  }catch(e){$('cmts').innerHTML="<div class='hyphen'>"+esc('回应读不出来：'+e.message)+"</div>";}
}
function renderCmts(){
  if(!CUR)return;
  const box=$('cmts'),list=CMTS.filter(c=>String(c.moment_id)===String(CUR.id));
  if(!list.length){box.innerHTML="<div class='hyphen'>还没有人回应。</div>";return;}
  box.innerHTML='';
  list.forEach(c=>{
    const mine=c.user_id===ME.id;
    const d=document.createElement('div');d.className='cmt'+(mine?' mine':'');
    d.innerHTML="<div class='ch'><span>"+esc(who(c.user_id))+"</span><span>"+esc(fmt(c.created_at))+"</span>"+(mine?"<span class='cdel'>删</span>":'')+"</div><div class='cb'>"+esc(c.content)+"</div>";
    if(mine){const del=d.querySelector('.cdel');del.onclick=ev=>{ev.stopPropagation();delCmt(c);};}
    box.appendChild(d);
  });
}
async function sendCmt(){
  const v=$('cInput').value.trim();if(!v){toast('还没写字呢');return;}
  const b=$('cSend');if(b.disabled)return;b.disabled=true;
  try{
    const row=await api('/rest/v1/moment_comments',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({moment_id:CUR.id,user_id:ME.id,content:v})});
    const r=Array.isArray(row)?row[0]:null;
    if(r)CMTS.push(r); $('cInput').value=''; renderCmts();
  }catch(e){toast('没存上：'+e.message);}
  finally{b.disabled=false;}
}
async function delCmt(c){
  if(!confirm('删掉这条回应？'))return;
  try{await api('/rest/v1/moment_comments?id=eq.'+encodeURIComponent(c.id),{method:'DELETE'});
    CMTS=CMTS.filter(x=>x.id!==c.id);renderCmts();toast('删了');}
  catch(e){toast('删不掉：'+e.message);}
}
async function delMoment(){
  if(!CUR||!confirm('这条要删掉吗？删了就找不回来了。'))return;
  try{await api('/rest/v1/diary_moments?id=eq.'+encodeURIComponent(CUR.id),{method:'DELETE'});
    MOMS=MOMS.filter(x=>x.id!==CUR.id);CUR=null;show('feed');renderFeed();toast('删了');}
  catch(e){toast('删不掉：'+e.message);}
}

/* ---------- 发 ---------- */
function renderPicks(){
  const box=$('picks');box.innerHTML='';
  PEND.forEach((p,i)=>{const d=document.createElement('div');d.className='pk';
    d.innerHTML="<img src='"+p.url+"'><span class='x' data-x='"+i+"'>×</span>";box.appendChild(d);});
  if(PEND.length<4){const a=document.createElement('div');a.className='add';a.textContent='+';box.appendChild(a);}
}
$('picks').onclick=e=>{
  const x=e.target.closest('[data-x]');
  if(x){const i=+x.dataset.x;try{URL.revokeObjectURL(PEND[i].url);}catch(err){}PEND.splice(i,1);renderPicks();return;}
  if(e.target.closest('.add'))$('fileIn').click();
};
function compress(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      try{
        let w=im.naturalWidth,h=im.naturalHeight;const mx=1280;
        if(w>mx||h>mx){const r=mx/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(im,0,0,w,h);
        cv.toBlob(b=>{URL.revokeObjectURL(u);b?res(b):rej(new Error('这张图压不动'));},'image/jpeg',0.72);
      }catch(e){URL.revokeObjectURL(u);rej(e);}
    };
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('这张图读不出来'));};
    im.src=u;
  });
}
async function uploadBlob(b){
  const folder=(ME.id==='ai_哥哥')?'ai':'user';
  const path=folder+'/'+Date.now()+'_'+Math.floor(Math.random()*99999)+'.jpg';
  const r=await fetch(SB_URL+'/storage/v1/object/moments/'+path,{method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'image/jpeg','x-upsert':'false'},body:b});
  if(!r.ok){
    let t='';try{t=await r.text();}catch(e){}
    let m='图片没传上去（'+r.status+'）';
    try{const d=JSON.parse(t);m=d.message||d.error||m;}catch(e){if(t)m=t.slice(0,80);}
    throw new Error(m);
  }
  return SB_URL+'/storage/v1/object/public/moments/'+path;
}
$('fileIn').onchange=async function(){
  const files=Array.prototype.slice.call(this.files||[]);this.value='';
  if(!files.length)return;
  const room=4-PEND.length;
  if(room<=0){toast('最多四张');return;}
  for(const f of files.slice(0,room)){
    try{const b=await compress(f);PEND.push({blob:b,url:URL.createObjectURL(b)});renderPicks();}
    catch(e){toast(e.message||'这张图不行');}
  }
};
async function postMoment(){
  const txt=$('mText').value.trim();
  if(!txt&&!PEND.length){toast('空的呢，写点什么再发');return;}
  const btn=$('postBtn');if(btn.disabled)return;btn.disabled=true;
  try{
    const urls=[];
    for(let i=0;i<PEND.length;i++){btn.textContent='传图 '+(i+1)+'/'+PEND.length+'……';urls.push(await uploadBlob(PEND[i].blob));}
    btn.textContent='发出去……';
    await api('/rest/v1/diary_moments',{method:'POST',headers:{'Prefer':'return=minimal'},
      body:JSON.stringify({user_id:ME.id,content:txt,images:urls,private:$('onlyme').classList.contains('on')})});
    PEND.forEach(p=>{try{URL.revokeObjectURL(p.url);}catch(e){}});
    PEND=[];$('mText').value='';$('onlyme').classList.remove('on');renderPicks();
    toast('发出去了');setNav('feed');show('feed');await loadFeed();
  }catch(e){toast('没发出去：'+e.message);}
  finally{btn.disabled=false;btn.textContent='发出去';}
}

/* ---------- 交互 ---------- */
$('backD').onclick=()=>{CUR=null;show('feed');renderFeed();setTimeout(()=>window.scrollTo(0,LY),0);};
$('backC').onclick=()=>{setNav('feed');show('feed');renderFeed();};
$('delM').onclick=delMoment;
$('cSend').onclick=sendCmt;
$('postBtn').onclick=postMoment;
$('onlyme').onclick=function(){this.classList.toggle('on');};
$('fresh').onclick=async function(){await loadFeed(true);toast('刷新了');};
$('nav').addEventListener('click',e=>{const d=e.target.closest('div[data-tab]');if(!d)return;
  setNav(d.dataset.tab);if(d.dataset.tab==='feed'){show('feed');renderFeed();}else show('compose');});

(function boot(){
  let sp=null;try{sp=localStorage.getItem('diary_pin');}catch(e){}
  if(sp&&/^\d{4}$/.test(sp)){PIN=sp;drawPin();doLogin();}
  else{drawPin();}
})();
</script>
