<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>渡晞 · 计算机</title><meta name="theme-color" content="#ffffff">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:#fff;font-family:-apple-system,sans-serif;color:#000;overflow:hidden}
.wrap{position:fixed;inset:0;max-width:520px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;font-size:14px;color:#9a9a9a}
.top a{text-decoration:none;color:#666;font-size:16px}
.top .r{margin-left:auto;display:flex;gap:14px;color:#9a9a9a}
.out{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:10px 8px 12px}
.out small{font-size:14px;color:#b0b0b0;min-height:20px;word-break:break-all}
.out b{font-size:46px;font-weight:300;line-height:1.1;word-break:break-all;text-align:right}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.k{height:52px;border-radius:12px;background:#f2f2f3;display:flex;align-items:center;justify-content:center;font-size:22px;color:#111}
.k:active{background:#e6e6e8}
.k.fn{color:#5b5b5b;font-size:18px}
.k.op{background:#fae6d2;color:#b5652f}
.k.eq{background:#f0a24a;color:#fff;font-size:24px}
</style></head><body>
<div class="wrap">
  <div class="top"><a href="index.html">‹</a><span>标准</span></div>
  <div class="out"><small id="hist"></small><b id="out">0</b></div>
  <div class="pad" id="pad">
    <div class="k fn" data-k="AC">AC</div><div class="k fn" data-k="%">%</div><div class="k fn" data-k="del">⌫</div><div class="k op" data-k="/">÷</div>
    <div class="k" data-k="7">7</div><div class="k" data-k="8">8</div><div class="k" data-k="9">9</div><div class="k op" data-k="*">×</div>
    <div class="k" data-k="4">4</div><div class="k" data-k="5">5</div><div class="k" data-k="6">6</div><div class="k op" data-k="-">−</div>
    <div class="k" data-k="1">1</div><div class="k" data-k="2">2</div><div class="k" data-k="3">3</div><div class="k op" data-k="+">+</div>
    <div class="k" data-k="00">00</div><div class="k" data-k="0">0</div><div class="k" data-k=".">.</div><div class="k eq" data-k="=">=</div>
  </div>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i);};
var e='';
function show(){$('out').textContent=e||'0';}
function pct(){ if(!e)return; e=(e+'/100'); }
function calc(){
  var s=e;
  if(!/^[0-9+\-*/().% ]+$/.test(s))return null;
  try{var v=Function('return ('+s+')')();if(!isFinite(v))return null;return String(Math.round(v*1e10)/1e10);}catch(err){return null;}
}
$('pad').onclick=function(ev){
  var b=ev.target.closest('[data-k]');if(!b)return;
  var k=b.dataset.k;
  if(k==='AC'){e='';$('hist').textContent='';show();return;}
  if(k==='del'){e=e.slice(0,-1);show();return;}
  if(k==='%'){pct();show();return;}
  if(k==='='){
    var r=calc();
    if(r===null){$('hist').textContent=e+' =';$('out').textContent='算不了';e='';return;}
    $('hist').textContent=e+' =';e=r;show();return;
  }
  e+=k;show();
};
})();
</script></body></html>
