<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>渡晞 · 计算机</title><meta name="theme-color" content="#fff6fa">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:-apple-system,sans-serif;color:#5a4550;
 background:linear-gradient(170deg,#fffafc,#fff2f7 60%,#f8efff)}
.wrap{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 24px;height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px}
.top a{width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid #f2dde5;color:#b08a99;text-decoration:none;display:flex;align-items:center;justify-content:center}
.screen{margin-top:auto;text-align:right;padding:0 6px 14px}
.screen small{display:block;font-size:13px;color:#bca7b2;min-height:18px;word-break:break-all}
.screen b{display:block;font-size:42px;font-weight:300;color:#5a4550;word-break:break-all;line-height:1.15}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.pad div{height:62px;border-radius:18px;background:rgba(255,255,255,.86);border:1px solid #f4e2eb;display:flex;align-items:center;justify-content:center;font-size:20px;color:#6a4f5c}
.pad div:active{transform:scale(.96);background:#fff3f8}
.pad div.op{color:#b5657f;background:rgba(255,240,246,.95)}
.pad div.eq{background:linear-gradient(135deg,#ffd0e0,#f0d4ff);color:#9c4a68;font-weight:600}
.pad div.zero{grid-column:span 2}
</style></head><body>
<div class="wrap">
  <div class="top"><a href="index.html">‹</a></div>
  <div class="screen"><small id="hist"></small><b id="out">0</b></div>
  <div class="pad" id="pad">
    <div class="op" data-k="C">C</div><div class="op" data-k="del">⌫</div><div class="op" data-k="(">(</div><div class="op" data-k=")">)</div>
    <div data-k="7">7</div><div data-k="8">8</div><div data-k="9">9</div><div class="op" data-k="/">÷</div>
    <div data-k="4">4</div><div data-k="5">5</div><div data-k="6">6</div><div class="op" data-k="*">×</div>
    <div data-k="1">1</div><div data-k="2">2</div><div data-k="3">3</div><div class="op" data-k="-">−</div>
    <div class="zero" data-k="0">0</div><div data-k=".">.</div><div class="op" data-k="+">+</div>
    <div class="eq" data-k="=">=</div>
  </div>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i);};
var e='';
function show(){$('out').textContent=e||'0';}
function calc(){
  var s=e.replace(/×/g,'*');
  if(!/^[0-9+\-*/().% ]+$/.test(s))return '算不了';
  try{var v=Function('return ('+s+')')();if(!isFinite(v))return '算不了';return String(Math.round(v*1e10)/1e10);}catch(err){return '算不了';}
}
$('pad').onclick=function(ev){
  var b=ev.target.closest('[data-k]');if(!b)return;
  var k=b.dataset.k;
  if(k==='C'){e='';show();return;}
  if(k==='del'){e=e.slice(0,-1);show();return;}
  if(k==='='){
    var r=calc();
    $('hist').textContent=e+' =';
    e=(r==='算不了')?'':r;show();return;
  }
  e+=k;show();
};
})();
</script></body></html>
