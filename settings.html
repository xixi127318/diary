<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>渡晞 · 设置</title><meta name="theme-color" content="#f7f7f8">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:#f4f4f5;font-family:-apple-system,"PingFang SC",sans-serif;color:#222}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top a{width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid #e9e9ea;color:#666;text-decoration:none;display:flex;align-items:center;justify-content:center}
.top b{font-size:16px;font-weight:600}
.group{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:15px 14px;font-size:15px;background:#fff}
.row:active{background:#f6f6f7}
.row .ic{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;flex-shrink:0}
.row .r{margin-left:auto;color:#9a9a9a;font-size:13px;display:flex;align-items:center;gap:8px}
.row .arrow{color:#c9c9c9;font-size:14px}
.row .thumb{width:34px;height:34px;border-radius:8px;background:#e2e2e2;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.row .thumb img{width:100%;height:100%;object-fit:cover}
.hint{padding:10px 14px 12px;font-size:11.5px;color:#9a9a9a;line-height:1.9;background:#fff}
.cap{padding:0 4px 6px;font-size:11.5px;color:#9a9a9a}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:60;display:none;align-items:center;justify-content:center;padding:0 24px}
.mask.on{display:flex}
.dlg{width:100%;max-width:340px;background:#fff;border-radius:16px;padding:18px 16px 14px}
.dlg b{font-size:15px;display:block;margin-bottom:6px}
.dlg p{font-size:11.5px;color:#9a9a9a;line-height:1.8;margin:0 0 10px}
.dlg input{width:100%;border:1px solid #e6e6e7;border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;outline:none}
.dlg .btns{display:flex;gap:10px;margin-top:14px}
.dlg .btns button{flex:1;height:42px;border-radius:10px;border:none;font-size:14.5px;font-family:inherit}
.b1{background:#f0f0f1;color:#555}.b2{background:#07c160;color:#fff}
.toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:rgba(0,0,0,.76);color:#fff;font-size:13px;padding:9px 16px;border-radius:16px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:84vw;text-align:center;line-height:1.6}
.toast.on{opacity:1}
</style></head><body>
<div class="wrap">
  <div class="top"><a href="index.html">‹</a><b>设置</b></div>

  <div class="cap">桌面</div>
  <div class="group">
    <div class="row" id="rWall"><span class="ic" style="background:#7d8a90">图</span>背景图<span class="r"><span class="arrow">›</span></span></div>
    <div class="row" id="rAvMe"><span class="ic" style="background:#4a90e2">我</span>我的头像<span class="r"><span class="thumb" id="tAvMe">晞</span><span class="arrow">›</span></span></div>
    <div class="row" id="rAvAi"><span class="ic" style="background:#8e7cf0">他</span>哥哥的头像<span class="r"><span class="thumb" id="tAvAi">渡</span><span class="arrow">›</span></span></div>
    <div class="row" id="rGreet"><span class="ic" style="background:#f59a6b">话</span>那句问候<span class="r" id="greetNow"></span><span class="arrow" style="margin-left:8px">›</span></div>
  </div>

  <div class="cap">解锁</div>
  <div class="group">
    <div class="row" id="rBio"><span class="ic" style="background:#07c160">脸</span>录入指纹<span class="r" id="bioState"></span><span class="arrow" style="margin-left:8px">›</span></div>
    <div class="row" id="rBioClr"><span class="ic" style="background:#e64b4b">清</span>清掉已录的认证<span class="r"><span class="arrow">›</span></span></div>
    <div class="hint" id="bioHint">网页只能调系统认证。这台手机只给了指纹，那就只能指纹。</div>
  </div>



  <div class="cap">系统</div>
  <div class="group">
    <div class="row" id="rUpd"><span class="ic" style="background:#c3c9cd">新</span>换新版<span class="r">清缓存再重开<span class="arrow">›</span></span></div>
    <div class="row" id="rHome"><span class="ic" style="background:#07c160">桌</span>回桌面<span class="r"><span class="arrow">›</span></span></div>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dlg">
    <b id="dt">改一下</b>
    <p id="ds"></p>
    <input id="di">
    <div class="btns"><button class="b1" id="dNo">算了</button><button class="b2" id="dYes">存下</button></div>
  </div>
</div>

<input type="file" id="fWall" accept="image/*" style="display:none">
<input type="file" id="fAvMe" accept="image/*" style="display:none">
<input type="file" id="fAvAi" accept="image/*" style="display:none">
<div class="toast" id="toast"></div>

<script>
(function(){
var $=function(i){return document.getElementById(i);};
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on');},2400);}
function ls(k,d){var v=null;try{v=localStorage.getItem(k)}catch(e){}return v==null?d:v;}
function set(k,v){try{if(v===''||v==null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}}

function paint(){
  var a=ls('du_av_me',null);
  $('tAvMe').innerHTML=a?"<img src='"+a+"'>":'晞';
  var b=ls('du_av_ai',null);
  $('tAvAi').innerHTML=b?"<img src='"+b+"'>":'渡';
  var g=ls('du_greet',null);
  $('greetNow').textContent=g?g:'按时间自动';
  var c=ls('du_cred',null);
  $('bioState').textContent=c?'已录':'未录';
}
paint();

/* 居中编辑弹窗（不再从下面钻出来） */
var KEY='';
function dlg(title,sub,key,def){
  KEY=key;
  $('dt').textContent=title;$('ds').textContent=sub||'';
  $('di').value=ls(key,def)||'';
  $('mask').classList.add('on');setTimeout(function(){$('di').focus();},200);
}
$('dNo').onclick=function(){$('mask').classList.remove('on');};
$('mask').onclick=function(e){if(e.target.id==='mask')$('mask').classList.remove('on');};
$('dYes').onclick=function(){set(KEY,$('di').value.trim());$('mask').classList.remove('on');paint();toast('改好了');};

$('rGreet').onclick=function(){dlg('那句问候','清空就回到按时间自动变的那句','du_greet','');};



/* 图片 */
function compress(file,max){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      try{
        var w=im.naturalWidth,h=im.naturalHeight,m=max||1400;
        if(w>m||h>m){var r=m/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
        var cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(im,0,0,w,h);
        var d=cv.toDataURL('image/jpeg',0.82);URL.revokeObjectURL(u);res(d);
      }catch(e){URL.revokeObjectURL(u);rej(e);}
    };
    im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('这张图读不出来'));};
    im.src=u;
  });
}
$('rWall').onclick=function(){$('fWall').click();};
$('rAvMe').onclick=function(){$('fAvMe').click();};
$('rAvAi').onclick=function(){$('fAvAi').click();};
$('fWall').onchange=async function(){
  var f=this.files[0];this.value='';if(!f)return;
  try{var d=await compress(f,1600);set('du_wall',d);toast('换好了');}catch(e){toast('不行');}
};
$('fAvMe').onchange=async function(){
  var f=this.files[0];this.value='';if(!f)return;
  try{var d=await compress(f,420);set('du_av_me',d);paint();toast('换好了');}catch(e){toast('不行');}
};
$('fAvAi').onchange=async function(){
  var f=this.files[0];this.value='';if(!f)return;
  try{var d=await compress(f,420);set('du_av_ai',d);paint();toast('换好了');}catch(e){toast('不行');}
};

/* 认证 */
function b64(buf){var b=new Uint8Array(buf),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}
function ub64(str){var s=atob(str),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
$('rBio').onclick=async function(){
  if(!window.PublicKeyCredential){toast('这个浏览器不支持系统认证');return;}
  try{
    var ok=await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
    if(!ok){toast('这台设备/这个浏览器也没开系统认证');return;}
  }catch(e){}
  try{
    var cred=await navigator.credentials.create({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:'渡晞',id:location.hostname},
      user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'xi',displayName:'张映晞'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},
      timeout:60000
    }});
    set('du_cred',b64(cred.rawId));
    try{localStorage.setItem('du_last_uid',sessionStorage.getItem('du_uid')||'');}catch(e){}
    paint();toast('录好了');
  }catch(e){toast('没录上：'+(e.name||e.message||e));}
};
$('rBioClr').onclick=function(){set('du_cred',null);paint();toast('清掉了');};

/* 更新 */
$('rUpd').onclick=async function(){
  toast('去换新的了');
  try{
    if('serviceWorker' in navigator){var rs=await navigator.serviceWorker.getRegistrations();
      for(var i=0;i<rs.length;i++){try{await rs[i].update()}catch(e){}if(rs[i].waiting)rs[i].waiting.postMessage({type:'SKIP_WAITING'})}}
    if('caches' in window){var ks=await caches.keys();await Promise.all(ks.map(function(k){return caches.delete(k)}));}
  }catch(e){}
  location.replace('index.html?u='+Date.now());
};
$('rHome').onclick=function(){location.href='index.html';};
})();
</script></body></html>
