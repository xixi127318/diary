<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>跳出去</title><meta name="theme-color" content="#fffafc">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(170deg,#fffafc,#f7efff);font-family:-apple-system,"PingFang SC",sans-serif;color:#5a4550}
.box{max-width:340px;width:100%;padding:0 24px;text-align:center}
.ic{width:78px;height:78px;border-radius:20px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.12)}
h1{font-size:18px;font-weight:600;margin:0 0 8px}
p{font-size:12px;color:#a9a9a9;line-height:1.9;margin:0 0 22px}
a.go{display:block;height:48px;line-height:48px;border-radius:24px;background:#07c160;color:#fff;text-decoration:none;font-size:15px}
a.back{display:block;margin-top:14px;font-size:12.5px;color:#b0a8a8;text-decoration:none}
</style></head><body>
<div class="box">
  <div class="ic" id="ic">淘</div>
  <h1 id="t">要跳出去</h1>
  <p id="d">这个软件在手机外面，点下面会打开它。</p>
  <a class="go" id="go" href="#">打开</a>
  <a class="back" href="index.html">还是算了，回桌面</a>
</div>
<script>
(function(){
var q=location.search;
var map={
  music:{n:'网易云音乐',c:'#e60026',ch:'歌',u:'https://music.163.com/'},
  taobao:{n:'淘宝',c:'#ff5000',ch:'淘',u:'https://www.taobao.com/'}
};
var k=(q.match(/to=([a-z]+)/)||[])[1];
var x=map[k]||map.music;
document.getElementById('ic').textContent=x.ch;
document.getElementById('ic').style.background=x.c;
document.getElementById('t').textContent=x.n;
document.getElementById('d').textContent='这个软件在手机外面，点下面会打开它。回来的时候按返回就行。';
document.getElementById('go').href=x.u;
})();
</script></body></html>
