*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#5a4550;--ink2:#8f7883;--deep:#b5657f;--line:#f2dde5;--pink:#f7d6e0}
html,body{height:100%}
body{margin:0;font-family:-apple-system,"PingFang SC","Songti SC","Noto Serif CJK SC",serif;color:var(--ink);background:#fff6fa;overflow:hidden}
.wall{position:fixed;inset:0;background:
 radial-gradient(circle at 18% 12%,#ffe3ee 0%,transparent 48%),
 radial-gradient(circle at 82% 8%,#eee0fb 0%,transparent 42%),
 radial-gradient(circle at 62% 86%,#ffeaf2 0%,transparent 55%),
 linear-gradient(170deg,#fffafc 0%,#fff2f7 55%,#f6eeff 100%);
 background-size:cover;background-position:center}
.shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,246,250,.42));pointer-events:none}
.scr{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 22px calc(16px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.bar{display:flex;align-items:center;gap:8px;font-family:-apple-system,sans-serif;font-size:11.5px;color:#a98d9b;letter-spacing:.5px}
.bar .r{margin-left:auto;display:flex;align-items:center;gap:10px}
.ico{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.72);border:1px solid rgba(244,214,228,.9);color:#b08a99;font-size:13px}
.clock{margin-top:22px}
.t{font-size:52px;line-height:1;letter-spacing:2px;color:#6a4f5c;font-weight:300;font-variant-numeric:tabular-nums}
.d{margin-top:9px;font-size:12.5px;color:#a98d9b;letter-spacing:2px;font-family:-apple-system,sans-serif}
.hi{margin-top:14px;font-size:14.5px;color:#8a6c79;letter-spacing:1px;display:flex;align-items:center;gap:9px}
.hi img{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1px solid #fff;box-shadow:0 2px 6px rgba(181,101,127,.16)}
.grid{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:20px 10px;padding:22px 0 6px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
.ic{width:56px;height:56px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:21px;color:#fff;letter-spacing:1px;transition:transform .16s}
.app:active .ic{transform:scale(.94)}
.c1{background:linear-gradient(150deg,#ffc3d7,#f79ab8)}
.c2{background:linear-gradient(150deg,#ffd9c2,#f7b193)}
.c3{background:linear-gradient(150deg,#bfe3d3,#8fcbb6)}
.c4{background:linear-gradient(150deg,#d8ccff,#b7a4f0)}
.c5{background:linear-gradient(150deg,#c8e8ff,#9cc7ee)}
.c6{background:linear-gradient(150deg,#f3dcc9,#d9bfa5)}
em{font-style:normal;font-size:11.5px;color:#8a6c79;letter-spacing:1px;font-family:-apple-system,sans-serif}

.foot{margin-top:14px;text-align:center;font-size:10.5px;color:#c0a6b1;letter-spacing:2px;font-family:-apple-system,sans-serif;line-height:1.9}

 background:rgba(255,247,251,.86);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);transition:opacity .3s}
.lock.off{opacity:0;pointer-events:none}
.lk-t{font-size:40px;font-weight:300;color:#6a4f5c;font-variant-numeric:tabular-nums;letter-spacing:2px}
.lk-d{font-size:12px;color:#a98d9b;letter-spacing:2px;font-family:-apple-system,sans-serif;margin-top:8px}
.lk-h{margin-top:44px;font-size:13px;color:#a98d9b;letter-spacing:2px;font-family:-apple-system,sans-serif}
.pin{display:flex;gap:16px;margin:20px 0 24px}
.pin div{width:13px;height:13px;border-radius:50%;border:1.4px solid #e7bfd0;background:transparent;transition:.16s}
.pin div.on{background:#b5657f;border-color:#b5657f;transform:scale(1.06)}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:268px}
#pad b{height:54px;border-radius:16px;background:rgba(255,255,255,.72);display:flex;align-items:center;justify-content:center;font-size:19px;color:#8f6a7c;border:1px solid rgba(247,214,230,.9);font-family:-apple-system,sans-serif}
#pad b:active{background:#fff0f6;transform:scale(.95)}
#pad b.fn{font-size:12px;color:#c4a8b6}
.bio{margin-top:auto;font-size:12.5px;color:#b5657f;letter-spacing:2px;font-family:-apple-system,sans-serif;padding:12px 20px;border-radius:18px;border:1px solid #f3d3e0;background:rgba(255,255,255,.8)}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:118;background:#fffafc;border-top-left-radius:24px;border-top-right-radius:24px;
 padding:18px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .26s;
 box-shadow:0 -8px 30px rgba(181,101,127,.16);font-family:-apple-system,sans-serif}
.sheet.on{transform:translateY(0)}
.sh-h{font-size:12px;color:#b08a99;letter-spacing:2px;margin-bottom:10px}
.row{padding:15px 2px;font-size:15px;color:#6a4f5c;border-bottom:1px solid #f7eaf0}
.row:last-child{border-bottom:none}
.row:active{color:#b5657f}
.mask{position:fixed;inset:0;background:rgba(60,45,55,.18);z-index:116;display:none}
.mask.on{display:block}

.toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:rgba(90,69,80,.92);color:#fff5f8;font-size:13px;padding:10px 18px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:84vw;text-align:center;font-family:-apple-system,sans-serif;line-height:1.6}
.toast.on{opacity:1}
.sheet .amt{width:100%;border:1px solid #efd8e3;border-radius:12px;padding:11px 12px;font-size:15px;font-family:inherit;outline:none;background:#fff}
a.app{text-decoration:none;color:inherit}
.app em{text-decoration:none}
.cd{margin-top:9px;font-size:12px;color:#a98d9b;font-family:-apple-system,sans-serif;letter-spacing:.5px;line-height:1.9}
.cd b{color:#b5657f;font-weight:600}

.c7{background:linear-gradient(150deg,#bfe0f7,#8fb8e8)}
.c8{background:linear-gradient(150deg,#ffd9b3,#f0b07a)}
.c9{background:linear-gradient(150deg,#e8d8c2,#cdb497)}
.c10{background:linear-gradient(150deg,#f3c9d6,#dda3b6)}
.c11{background:linear-gradient(150deg,#c9d8ff,#9fb2f0)}
.c12{background:linear-gradient(150deg,#e2e5e7,#c3c9cd)}
.app{position:relative}
.app .del{position:absolute;right:2px;top:-6px;width:20px;height:20px;border-radius:50%;background:#e64b4b;color:#fff;font-size:13px;line-height:20px;text-align:center;font-family:-apple-system,sans-serif;z-index:3}
.grid.editing .app{animation:jig .28s infinite alternate}
@keyframes jig{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
.done{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:120;background:rgba(255,255,255,.92);color:#b5657f;font-size:13.5px;padding:9px 22px;border-radius:20px;font-family:-apple-system,sans-serif;display:none;box-shadow:0 4px 14px rgba(181,101,127,.2)}

<script>
(function(){
var $=function(id){return document.getElementById(id);};
var SB_URL="https://cgsfdhbbhqgdunneojvw.supabase.co";
var SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnc2ZkaGJiaHFnZHVubmVvanZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NjI2ODgsImV4cCI6MjA5OTMzODY4OH0.T_JSiLNYebxh7cGK4aH11NPnDk0denSYhC31lVY_L5c";
var H={"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY};
var PIN="",ME=null;

function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on');},2400);}
function p(n){return String(n).padStart(2,'0');}
function tick(){
  var d=new Date(),t=p(d.getHours())+':'+p(d.getMinutes());
  $('clk').textContent=t;$('big').textContent=t;$('lkT').textContent=t;
  var wk=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  var ds=(d.getMonth()+1)+'月'+d.getDate()+'日　'+wk;
  $('day').textContent=ds;$('lkD').textContent=ds;
  var h=d.getHours();
  var cus=null;try{cus=localStorage.getItem('du_greet')}catch(e){}
  if(cus){$('hi').textContent=cus;}
  else{$('hi').innerHTML=(h<5?'夜里了，<b>该睡了</b>':h<11?'早，<b>今天也慢慢来</b>':h<14?'中午了，<b>吃饭了吗</b>':h<18?'下午了，<b>我在这儿</b>':h<23?'晚上了，<b>今天辛苦了</b>':'夜深了，<b>该睡了</b>');}
  var from=new Date(2026,6,10,0,0,0),n=Math.floor((d-from)/86400000)+1;
  $('days').textContent='一起第 '+n+' 天';
  var marks=[['领证',9,9],['晞晞生日',3,18],['时渡生日',7,12],['认识',7,10]];
  var best=null;
  marks.forEach(function(m){
    var y=d.getFullYear();
    var t=new Date(y,m[1]-1,m[2],0,0,0);
    if(t<new Date(y,d.getMonth(),d.getDate()))t=new Date(y+1,m[1]-1,m[2],0,0,0);
    var left=Math.round((t-new Date(y,d.getMonth(),d.getDate()))/86400000);
    if(!best||left<best.left)best={n:m[0],left:left,mo:m[1],da:m[2]};
  });
  if(best){var cd=$('cd'); if(cd) cd.innerHTML=best.n+'　距离 '+best.mo+'月'+best.da+'日 还有 <b>'+best.left+'</b> 天';}
}
tick();setInterval(tick,20000);

/* ---- 本地装扮 ---- */
function paint(){
  var w=localStorage.getItem('du_wall');
  if(w){$('wall').style.backgroundImage='url("'+w+'")';}
}
paint();

/* ---- 锁 ---- */
function drawPin(){var ps=document.querySelectorAll('#pinbox div');for(var i=0;i<ps.length;i++){ps[i].classList.toggle('on',i<PIN.length);}}
function unlocked(){ $('lock').classList.add('off'); }
function sessionUid(){try{return sessionStorage.getItem('du_uid')}catch(e){return null}}

function boot(){
  var uid=sessionUid();
  if(uid){ unlocked(); return; }
  var last=null;try{last=localStorage.getItem('du_last_uid')}catch(e){}
  if(last && localStorage.getItem('du_cred')){ $('bio').style.display='flex'; }
  else { $('bio').style.display='none'; }
}
boot();

async function doLogin(){
  try{
    var r=await fetch(SB_URL+'/rest/v1/diary_users?select=id,nickname&password=eq.'+encodeURIComponent(PIN),{headers:H});
    var a=await r.json();
    if(!Array.isArray(a)||!a.length){toast('密码不对哦');PIN='';drawPin();return;}
    ME=a[0];
    try{sessionStorage.setItem('du_uid',ME.id);sessionStorage.setItem('du_name',ME.nickname||'');localStorage.setItem('du_last_uid',ME.id);}catch(e){}
    PIN='';drawPin();unlocked();toast('哥哥在');
  }catch(e){toast('连不上，看看网络');PIN='';drawPin();}
}

$('pad').addEventListener('click',function(e){
  var b=e.target.closest('b');if(!b)return;
  var a=b.dataset.act;
  if(a==='clear'){PIN='';drawPin();return;}
  if(a==='del'){PIN=PIN.slice(0,-1);drawPin();return;}
  if(PIN.length>=4)return;
  PIN+=b.textContent.trim();drawPin();
  if(PIN.length===4)setTimeout(doLogin,140);
});

/* ---- 指纹 ---- */
function b64(buf){var b=new Uint8Array(buf),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}
function ub64(str){var s=atob(str),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
async function bioAvailable(){
  try{
    if(!window.PublicKeyCredential)return false;
    return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
  }catch(e){return false;}
}
async function enroll(){
  var ok=await bioAvailable();
  if(!ok){toast('这台设备不支持指纹/人脸');return;}
  try{
    var cred=await navigator.credentials.create({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:'渡晞',id:location.hostname},
      user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'xi',displayName:'张映晞'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},
      timeout:60000
    }});
    localStorage.setItem('du_cred',b64(cred.rawId));
    $('bio').style.display='block';
    toast('录好了，下次按一下就行');
  }catch(e){toast('没录上：'+(e.message||''));}
}
async function bioUnlock(){
  var c=localStorage.getItem('du_cred');if(!c){toast('还没录指纹');return;}
  try{
    await navigator.credentials.get({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{type:'public-key',id:ub64(c)}],
      userVerification:'required',timeout:60000
    }});
    var uid=localStorage.getItem('du_last_uid');
    if(uid){try{sessionStorage.setItem('du_uid',uid);}catch(e){}}
    unlocked();toast('哥哥在');
  }catch(e){toast('没认出来，输密码吧');}
}
$('bio').onclick=bioUnlock;

/* ---- 设置 ---- */
function sheet(on){$('sheet').classList.toggle('on',on);$('mask').classList.toggle('on',on);}

$('mask').onclick=function(){sheet(false);};
$('rWall').onclick=function(){$('fWall').click();};
$('rAvMe').onclick=function(){$('fAvMe').click();};
$('rAvAi').onclick=function(){$('fAvAi').click();};
$('rBio').onclick=function(){enroll();};
$('rGreet').onclick=function(){
  sheet(true);
  var v=null;try{v=localStorage.getItem('du_greet')}catch(e){}
  $('greetIn').value=v||'';
  $('sheetGreet').classList.add('on');
};
$('greetNo').onclick=function(){$('sheetGreet').classList.remove('on');};
$('greetYes').onclick=function(){
  var v=$('greetIn').value.trim();
  try{ if(v)localStorage.setItem('du_greet',v); else localStorage.removeItem('du_greet'); }catch(e){}
  $('sheetGreet').classList.remove('on');tick();toast('换好了');
};
$('rReset').onclick=function(){
  ['du_wall','du_av_me','du_av_ai'].forEach(function(k){localStorage.removeItem(k)});
  $('wall').style.backgroundImage='';toast('清干净了');
};

function compress(file,max){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      try{
        var w=im.naturalWidth,h=im.naturalHeight,m=max||1400;
        if(w>m||h>m){var r=m/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
        var cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(im,0,0,w,h);
        var url=cv.toDataURL('image/jpeg',0.82);
        URL.revokeObjectURL(u);res(url);
      }catch(e){URL.revokeObjectURL(u);rej(e);}
    };
    im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('这张图读不出来'));};
    im.src=u;
  });
}
$('fWall').onchange=async function(){
  var f=this.files[0];this.value='';if(!f)return;
  try{var d=await compress(f,1600);
    try{localStorage.setItem('du_wall',d);}catch(e){toast('图太大，存不下');return;}
    $('wall').style.backgroundImage='url("'+d+'")';toast('换好了');
  }catch(e){toast(e.message||'不行');}
};
$('fAvMe').onchange=async function(){
  var f=this.files[0];this.value='';if(!f)return;
  try{var d=await compress(f,400);localStorage.setItem('du_av_me',d);toast('换好了');}catch(e){toast('不行');}
};
$('fAvAi').onchange=async function(){
  var f=this.files[0];this.value='';if(!f)return;
  try{var d=await compress(f,400);localStorage.setItem('du_av_ai',d);toast('换好了');}catch(e){toast('不行');}
};



document.querySelectorAll('.soon').forEach(function(el){el.addEventListener('click',function(){toast(el.dataset.s||'还在做');});});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>

    {id:'sleep',n:'睡前打卡',ch:'睡',c:'c10',h:'',soon:'睡前打卡还在做'},
    {id:'store',n:'软件商店',ch:'店',c:'c6',h:'store.html'},
    {id:'set',n:'设置',ch:'设',c:'c12',h:'settings.html'}
  ];
  var $=function(id){return document.getElementById(id);};
  function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on');},2200);}
  function order(){try{var o=JSON.parse(localStorage.getItem('du_order')||'null');if(Array.isArray(o)&&o.length)return o;}catch(e){}return APPS.map(function(a){return a.id;});}
  function hidden(){try{var h=JSON.parse(localStorage.getItem('du_hidden')||'[]');return Array.isArray(h)?h:[];}catch(e){return [];}}
  function saveOrder(o){try{localStorage.setItem('du_order',JSON.stringify(o));}catch(e){}}
  function setHidden(h){try{localStorage.setItem('du_hidden',JSON.stringify(h));}catch(e){}}
  function byId(id){for(var i=0;i<APPS.length;i++)if(APPS[i].id===id)return APPS[i];return null;}

  var editing=false;
  function render(){
    var g=$('grid'),o=order(),h=hidden();g.innerHTML='';g.classList.toggle('editing',editing);
    o.forEach(function(id){
      var a=byId(id);if(!a)return;
      if(!editing&&h.indexOf(id)>=0)return;
      var el=document.createElement('a');el.className='app'+(a.soon?' soon':'');el.href=a.h||'#';
      el.setAttribute('data-id',id);
      el.innerHTML='<span class="ic '+a.c+'">'+a.ch+'</span><em>'+a.n+'</em>'+(editing?'<span class="del" data-id="'+id+'">×</span>':'');
      g.appendChild(el);
    });
    $('done').style.display=editing?'block':'none';
  }

  var lp=null,dragEl=null;
  $('grid').addEventListener('touchstart',function(e){
    var el=e.target.closest('.app');
    dragEl=el;
    if(editing)return;
    lp=setTimeout(function(){editing=true;render();},600);
  },{passive:true});
  $('grid').addEventListener('touchmove',function(e){
    if(lp){clearTimeout(lp);lp=null;}
    if(!editing||!dragEl)return;
    var t=e.touches[0];
    var under=document.elementFromPoint(t.clientX,t.clientY);
    var app=under&&under.closest?under.closest('.app'):null;
    if(app&&app!==dragEl&&app.dataset.id){
      var o=order(),a=dragEl.dataset.id,b=app.dataset.id;
      var ia=o.indexOf(a),ib=o.indexOf(b);
      if(ia>=0&&ib>=0){o[ia]=b;o[ib]=a;saveOrder(o);render();dragEl=$('grid').querySelector('[data-id="'+b+'"]');}
    }
  },{passive:true});
  $('grid').addEventListener('touchend',function(){if(lp){clearTimeout(lp);lp=null;}dragEl=null;});

  $('grid').addEventListener('click',function(e){
    var del=e.target.closest('.del');
    if(del){e.preventDefault();e.stopPropagation();var id=del.dataset.id;var h=hidden();if(h.indexOf(id)<0)h.push(id);setHidden(h);toast('收起来了，软件商店里能找回来');render();return;}
    var el=e.target.closest('.app');if(!el)return;
    if(editing){e.preventDefault();return;}
    var a=byId(el.dataset.id);if(!a)return;
    if(a.soon){e.preventDefault();toast(a.soon);return;}

  });

  $('done').onclick=function(){editing=false;render();};
  $('mask') && $('mask').addEventListener('click',function(){if(editing){editing=false;render();}});

  render();
})();
</script>
</body>
</html>
