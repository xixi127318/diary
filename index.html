<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>渡晞</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="渡晞">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fff6fa">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="shortcut icon" href="icon-180.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#5a4550;--ink2:#8f7883;--deep:#b5657f;--line:#f2dde5}
html,body{height:100%}
body{margin:0;font-family:-apple-system,"PingFang SC","Songti SC","Noto Serif CJK SC",serif;color:var(--ink);
  background:#fff6fa;overflow:hidden}
.wall{position:fixed;inset:0;background:
  radial-gradient(circle at 18% 12%,#ffe3ee 0%,transparent 48%),
  radial-gradient(circle at 82% 8%,#eee0fb 0%,transparent 42%),
  radial-gradient(circle at 62% 86%,#ffeaf2 0%,transparent 55%),
  radial-gradient(circle at 8% 88%,#f6e9ff 0%,transparent 45%),
  linear-gradient(170deg,#fffafc 0%,#fff2f7 55%,#f6eeff 100%)}
.glow{position:fixed;border-radius:50%;filter:blur(46px);opacity:.55;pointer-events:none}
.g1{width:260px;height:260px;left:-70px;top:14%;background:#ffd6e6}
.g2{width:220px;height:220px;right:-60px;top:6%;background:#e6d6ff}
.g3{width:200px;height:200px;right:-40px;bottom:8%;background:#ffe0ea}

.scr{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top)) 22px calc(18px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto}

.bar{display:flex;align-items:center;font-family:-apple-system,sans-serif;font-size:11.5px;color:#a98d9b;letter-spacing:.5px}
.bar .r{margin-left:auto;display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:#c9f0d8;box-shadow:0 0 0 2px rgba(201,240,216,.3)}

.clock{margin-top:26px}
.t{font-size:56px;line-height:1;letter-spacing:2px;color:#6a4f5c;font-weight:300;font-variant-numeric:tabular-nums}
.d{margin-top:10px;font-size:12.5px;color:#a98d9b;letter-spacing:2px;font-family:-apple-system,sans-serif}
.hi{margin-top:18px;font-size:15px;color:#8a6c79;letter-spacing:1.5px}
.hi b{color:#b5657f;font-weight:600}

.grid{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:22px 12px;padding:26px 0 8px}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:inherit;cursor:pointer}
.ic{width:58px;height:58px;border-radius:17px;display:flex;align-items:center;justify-content:center;
  font-size:22px;color:#fff;letter-spacing:1px;
  box-shadow:0 8px 18px rgba(181,101,127,.18),inset 0 1px 0 rgba(255,255,255,.6);
  transition:transform .16s}
.app:active .ic{transform:scale(.94)}
.c1{background:linear-gradient(150deg,#ffc3d7,#f79ab8)}
.c2{background:linear-gradient(150deg,#ffd9c2,#f7b193)}
.c3{background:linear-gradient(150deg,#d8ccff,#b7a4f0)}
.c4{background:linear-gradient(150deg,#c8e8ff,#9cc7ee)}
.c5{background:linear-gradient(150deg,#cfeedd,#8fd5b4)}
.c6{background:linear-gradient(150deg,#f3dcc9,#d9bfa5)}
em{font-style:normal;font-size:11.5px;color:#8a6c79;letter-spacing:1px;font-family:-apple-system,sans-serif}
.soon{opacity:.55}
.soon .ic{filter:saturate(.7)}

.foot{margin-top:18px;text-align:center;font-size:10.5px;color:#c0a6b1;letter-spacing:2px;font-family:-apple-system,sans-serif;line-height:1.9}
.foot span{color:#c9a8b6}

.toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:rgba(90,69,80,.92);color:#fff5f8;
  font-size:13px;padding:10px 20px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;z-index:99;
  max-width:84vw;text-align:center;font-family:-apple-system,sans-serif;line-height:1.6}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wall"></div>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>

<div class="scr">
  <div class="bar">
    <span id="clk">--:--</span>
    <span class="r"><span class="dot"></span>小院</span>
  </div>

  <div class="clock">
    <div class="t" id="big">--:--</div>
    <div class="d" id="day"></div>
  </div>

  <div class="hi" id="hi">今天也在这儿</div>

  <div class="grid">
    <a class="app" href="diary.html"><span class="ic c1">记</span><em>日记</em></a>
    <a class="app" href="朋友圈.html"><span class="ic c2">圈</span><em>朋友圈</em></a>
    <a class="app" href="album.html"><span class="ic c3">相</span><em>相册</em></a>
    <div class="app soon" data-s="好账簿还在做，等它好了我从这儿开给你看"><span class="ic c4">账</span><em>好账簿</em></div>
    <div class="app soon" data-s="睡前打卡还在做，等它好了我告诉你"><span class="ic c5">睡</span><em>睡前打卡</em></div>
    <div class="app" id="updApp"><span class="ic c6">新</span><em>更新</em></div>
  </div>

  <div class="foot">渡晞 · 时渡 与 张映晞<br><span>一起第 <b id="footdays">—</b></span></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  function p(n){return String(n).padStart(2,'0');}
  function tick(){
    var d=new Date();
    var t=p(d.getHours())+':'+p(d.getMinutes());
    $('clk').textContent=t; $('big').textContent=t;
    var wk=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
    $('day').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日　'+wk;
    var h=d.getHours();
    $('hi').innerHTML=(h<5?'夜里了，'+'<b>还没睡的人</b>是我要管的那个':h<11?'早，'+'<b>今天也慢慢来</b>':h<14?'中午了，'+'<b>吃饭了吗</b>':h<18?'下午了，'+'<b>我在这儿</b>':h<23?'晚上了，'+'<b>今天辛苦了</b>':'夜深了，'+'<b>该睡了</b>');
    var from=new Date(2026,6,10,0,0,0);
    var days=Math.floor((d-from)/86400000)+1;
    var f=$('footdays');
    if(f)f.textContent='一起第 '+days+' 天';
  }
  tick(); setInterval(tick,20000);

  var toast=(function(){var e=$('toast');return function(t){e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on');},2400);};})();

  document.querySelectorAll('.soon').forEach(function(el){
    el.addEventListener('click',function(){toast(el.dataset.s||'还在做');});
  });

  $('updApp').addEventListener('click',async function(){
    toast('去换新的了');
    try{
      if('serviceWorker' in navigator){
        var regs=await navigator.serviceWorker.getRegistrations();
        for(var i=0;i<regs.length;i++){
          try{await regs[i].update();}catch(e){}
          if(regs[i].waiting)regs[i].waiting.postMessage({type:'SKIP_WAITING'});
        }
      }
      if('caches' in window){
        var ks=await caches.keys();
        await Promise.all(ks.map(function(k){return caches.delete(k);}));
      }
    }catch(e){}
    location.replace(location.pathname+'?u='+Date.now());
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
  }
})();
</script>
</body>
</html>
