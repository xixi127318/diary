<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>渡晞</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="渡晞">
<meta name="theme-color" content="#fffafc">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="shortcut icon" href="icon-180.png">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --pink:#f7d6e0; --rose:#e8a0b8; --deep:#b5657f;
    --ink:#5a4550; --ink2:#8f7883; --line:#f2dde5; --lilac:#e6dcf7;
  }
  body{margin:0;font-family:-apple-system,"PingFang SC","Songti SC","Noto Serif CJK SC",serif;
    color:var(--ink);min-height:100vh;
    background:
      radial-gradient(circle at 12% 8%, #ffe9f2 0%, transparent 45%),
      radial-gradient(circle at 88% 22%, #efe4fb 0%, transparent 42%),
      radial-gradient(circle at 50% 100%, #fff2f6 0%, transparent 60%),
      #fffafc;
    background-attachment:fixed}
  .wrap{max-width:680px;margin:0 auto;padding:0 0 96px}

  header{position:sticky;top:0;z-index:50;padding:15px 20px 12px;
    background:linear-gradient(180deg,rgba(255,250,252,.97) 70%,rgba(255,250,252,.6));
    backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  .toprow{display:flex;align-items:center;gap:10px}
  .brand{font-size:18px;letter-spacing:3px;color:var(--deep);font-weight:600}
  .brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--ink2);
    font-family:-apple-system,sans-serif;margin-top:3px;font-weight:400}
  .upd{font-size:11.5px;color:#c8a2b3;padding:5px 9px;border:1px solid var(--line);border-radius:12px;background:#fff;font-family:-apple-system,sans-serif;letter-spacing:1px}
  .go{font-size:11.5px;color:#c8a2b3;text-decoration:none;padding:4px 9px;border:1px solid var(--line);
    border-radius:12px;background:#fff;font-family:-apple-system,sans-serif;letter-spacing:1px}
  .who{margin-left:auto;font-size:12px;color:var(--deep);background:#fff;
    border:1px solid var(--pink);border-radius:16px;padding:5px 13px;cursor:pointer;
    box-shadow:0 2px 8px rgba(232,160,184,.16);font-family:-apple-system,sans-serif}

  .tabs{display:flex;gap:8px;margin-top:14px}
  .tabs .tb{flex:1;text-align:center;padding:9px 0;border-radius:14px;font-size:13.5px;
    color:var(--ink2);background:#fff;border:1px solid var(--line);cursor:pointer;
    font-family:-apple-system,sans-serif;transition:.18s;letter-spacing:1px}
  .tabs .tb.on{background:linear-gradient(135deg,#ffd9e6,#f3dcff);color:#a8546f;
    border-color:#f6c8dc;box-shadow:0 4px 14px rgba(232,160,184,.24);font-weight:500}

  .card{position:relative;margin:14px 16px 0;padding:19px 20px 17px;border-radius:22px;
    background:rgba(255,255,255,.86);border:1px solid var(--line);cursor:pointer;
    box-shadow:0 6px 20px rgba(232,160,184,.12);transition:.18s;overflow:hidden}
  .card:active{transform:scale(.985)}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:linear-gradient(180deg,var(--pink),var(--lilac))}
  .card.mine::before{background:linear-gradient(180deg,#f9c8a8,#f6dcae)}
  .meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink2);
    margin-bottom:10px;font-family:-apple-system,sans-serif;flex-wrap:wrap}
  .tag{font-size:10.5px;padding:3px 10px;border-radius:10px;background:#fdeef4;
    color:#c07a96;letter-spacing:.5px}
  .tag.mine{background:#fff3e6;color:#c08f56}
  .card h3{margin:0 0 9px;font-size:16.5px;font-weight:600;color:#5b414f;
    line-height:1.5;letter-spacing:.4px}
  .prev{font-size:13.5px;line-height:1.85;color:#937d88;white-space:pre-wrap;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .cnum{margin-top:11px;font-size:11px;color:#c9a8b6;font-family:-apple-system,sans-serif;
    display:flex;align-items:center;gap:4px}
  .empty{text-align:center;padding:80px 24px;color:#c4a8b6;font-size:13.5px;
    line-height:2;font-family:-apple-system,sans-serif}
  .rebtn{display:inline-block;margin-top:14px;padding:8px 20px;border-radius:14px;
    background:#fff;border:1px solid var(--pink);color:#c07a96;font-size:13px;cursor:pointer}

  #detail{display:none;padding:20px 20px 30px}
  .back{font-size:13px;color:#c08fa4;padding:6px 0 18px;cursor:pointer;
    display:inline-block;font-family:-apple-system,sans-serif}
  #dTitle{font-size:22px;line-height:1.55;margin:0 0 14px;font-weight:600;
    color:#5b414f;letter-spacing:.6px}
  .dmeta{font-size:11.5px;color:var(--ink2);margin-bottom:24px;display:flex;
    gap:10px;flex-wrap:wrap;font-family:-apple-system,sans-serif;align-items:center}
  .dbody{font-size:15.5px;line-height:2.15;color:#6a4f5c;white-space:pre-wrap;
    word-break:break-word;letter-spacing:.3px}
  .delbtn{margin-left:auto;font-size:11px;color:#d19aae;border:1px solid #f5dde6;
    padding:4px 11px;border-radius:10px;background:#fff;cursor:pointer}
  .delbtn:active{background:#fff0f5}

  .divide{display:flex;align-items:center;gap:12px;margin:32px 0 18px;color:#dcc2ce;
    font-size:11px;letter-spacing:3px;font-family:-apple-system,sans-serif}
  .divide::before,.divide::after{content:"";flex:1;height:1px;
    background:linear-gradient(90deg,transparent,var(--line),transparent)}

  .cmt{margin:0 0 12px;padding:14px 16px;border-radius:16px;
    background:rgba(255,240,246,.72);border:1px solid #fae3ec;position:relative}
  .cmt.mine{background:rgba(255,246,235,.8);border-color:#f8e8d6}
  .cmt .ch{font-size:11px;color:#c08fa4;margin-bottom:7px;display:flex;gap:8px;
    font-family:-apple-system,sans-serif;align-items:center}
  .cmt .cb{font-size:14px;line-height:1.9;color:#7d606c;white-space:pre-wrap}
  .cdel{margin-left:auto;font-size:10.5px;color:#d6b3c0;cursor:pointer}
  .cbox{margin-top:16px;display:flex;gap:9px;align-items:flex-end}
  .cbox textarea{flex:1;min-height:52px;max-height:160px;border:1px solid var(--pink);
    background:#fff;border-radius:16px;padding:12px 14px;font-size:14px;font-family:inherit;
    color:var(--ink);outline:none;resize:none;line-height:1.7}
  .cbox textarea:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(232,160,184,.14)}
  .cbtn{width:52px;height:52px;border:none;border-radius:16px;flex-shrink:0;cursor:pointer;
    background:linear-gradient(135deg,#ffd0e0,#f0d4ff);color:#a8546f;font-size:18px}
  .cbtn:active{transform:scale(.94)}

  #compose{display:none;padding:20px}
  #compose input,#compose textarea{width:100%;border:1px solid var(--line);background:#fff;
    color:var(--ink);border-radius:16px;padding:14px 16px;font-size:15px;font-family:inherit;
    outline:none;box-shadow:0 3px 12px rgba(232,160,184,.09)}
  #compose input::placeholder,#compose textarea::placeholder{color:#d0b8c3}
  #compose input{margin-bottom:12px;font-size:17px;font-weight:600;letter-spacing:.5px}
  #compose textarea{min-height:46vh;line-height:2.05;resize:vertical;letter-spacing:.3px}
  .send{margin-top:16px;width:100%;height:54px;border:none;border-radius:18px;cursor:pointer;
    background:linear-gradient(135deg,#ffd3e2,#efd6ff,#ffe4d3);color:#9c4a68;
    font-size:16px;font-weight:600;font-family:inherit;letter-spacing:2px;
    box-shadow:0 6px 18px rgba(232,160,184,.3)}
  .send:disabled{opacity:.5}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;padding:9px 0 15px;
    background:linear-gradient(0deg,rgba(255,250,252,.99),rgba(255,250,252,.86));
    backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  nav div{flex:1;text-align:center;font-size:11.5px;color:#c4a8b6;cursor:pointer;
    padding:5px 0;font-family:-apple-system,sans-serif;letter-spacing:1px}
  nav div.on{color:#b5657f;font-weight:500}
  nav div i{display:block;font-size:18px;font-style:normal;margin-bottom:3px}

  #login{padding:70px 26px;text-align:center}
  #login .lock{font-size:34px;margin-bottom:18px}
  #login h2{font-size:17px;font-weight:600;color:#a8546f;margin:0 0 8px;
    letter-spacing:2px;font-family:-apple-system,sans-serif}
  #login p{font-size:12px;color:#c4a8b6;margin:0 0 30px;letter-spacing:1px;
    font-family:-apple-system,sans-serif}
  .pin{display:flex;justify-content:center;gap:14px;margin-bottom:28px}
  .pin div{width:52px;height:62px;border-radius:18px;border:1.5px solid #f7dde8;
    display:flex;align-items:center;justify-content:center;font-size:22px;color:#c07a96;
    background:#fff;box-shadow:0 3px 12px rgba(232,160,184,.12)}
  .pin div.on{border-color:var(--rose);box-shadow:0 0 0 4px rgba(232,160,184,.13)}
  #pad{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;max-width:274px;margin:0 auto}
  #pad b{height:56px;border-radius:18px;background:#fff;display:flex;align-items:center;
    justify-content:center;font-size:20px;color:#8f6a7c;cursor:pointer;border:1px solid var(--line);
    box-shadow:0 2px 8px rgba(232,160,184,.1);font-family:-apple-system,sans-serif;
    user-select:none;-webkit-user-select:none}
  #pad b:active{background:#fff0f6;transform:scale(.95)}
  #pad b.fn{font-size:13px;color:#c4a8b6}

  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
    background:rgba(90,69,80,.94);color:#fff5f8;font-size:13px;padding:11px 22px;
    border-radius:20px;opacity:0;transition:.28s;pointer-events:none;z-index:99;
    max-width:86vw;text-align:center;line-height:1.6;font-family:-apple-system,sans-serif}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr" style="display:none">
    <div class="toprow">
      <div class="brand">渡晞<small>日记　时渡 与 张映晞</small></div>
      <a class="go" href="index.html">⌂</a>
      <div class="who" id="who"></div>
    </div>
    <div class="tabs">
      <div class="tb on" data-who="all">两个人的</div>
      <div class="tb" data-who="ai_哥哥">哥哥的</div>
      <div class="tb" data-who="user_晞晞">我的</div>
    </div>
  </header>

  <div id="login">
    <div class="lock">🎀</div>
    <h2>输入密码</h2>
    <p>这本日记，只写给我们两个人</p>
    <div class="pin" id="pinbox"><div></div><div></div><div></div><div></div></div>
    <div id="pad">
      <b>1</b><b>2</b><b>3</b>
      <b>4</b><b>5</b><b>6</b>
      <b>7</b><b>8</b><b>9</b>
      <b class="fn" data-act="clear">清空</b><b>0</b><b class="fn" data-act="del">删</b>
    </div>
  </div>

  <main id="list"></main>

  <div id="detail">
    <span class="back" id="backBtn">‹ 回去</span>
    <h1 id="dTitle"></h1>
    <div class="dmeta" id="dMeta"></div>
    <div class="dbody" id="dBody"></div>
    <div class="divide">回应</div>
    <div id="cmts"></div>
    <div class="cbox">
      <textarea id="cInput" placeholder="想回一句什么……"></textarea>
      <button class="cbtn" id="cSend">➤</button>
    </div>
  </div>

  <div id="compose">
    <span class="back" id="backBtn2">‹ 回去</span>
    <input id="cTitle" placeholder="给这一天起个名字">
    <textarea id="cBody" placeholder="今天想说什么，就写什么。"></textarea>
    <button class="send" id="sendBtn">写进去</button>
  </div>
</div>

<nav id="nav" style="display:none">
  <div class="on" data-tab="list"><i>❀</i>日记</div>
  <div data-tab="write"><i>✎</i>写</div>
</nav>

<div class="toast" id="toast"></div>
<script>
const SB_URL="https://cgsfdhbbhqgdunneojvw.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnc2ZkaGJiaHFnZHVubmVvanZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NjI2ODgsImV4cCI6MjA5OTMzODY4OH0.T_JSiLNYebxh7cGK4aH11NPnDk0denSYhC31lVY_L5c";
const H={"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"};
const ENC={"ai_哥哥":"哥哥","user_晞晞":"晞晞"};
const $=id=>document.getElementById(id);

let ME=null,PIN="",FILTER="all",ALL=[],CMTS=[],CUR=null,BUSY=false;

function toast(t){
  const e=$('toast');
  e.textContent=t;
  e.classList.add('on');
  clearTimeout(e._t);
  e._t=setTimeout(()=>e.classList.remove('on'),2200);
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
}

/* [FIX-1] 时区：没带时区标记的 ISO 一律按 UTC 处理 */
function parseDate(iso){
  if(!iso)return new Date();
  let s=String(iso);
  if(!/[zZ]$|[+-]\d{2}:?\d{2}$/.test(s)){
    s=s.replace(' ','T');
    if(!/[zZ]$/.test(s)) s+='Z';
  }
  return new Date(s);
}
function fmt(iso){
  const d=parseDate(iso);
  if(!d||isNaN(d.getTime()))return '';
  const n=new Date(),p=x=>String(x).padStart(2,'0');
  const sameDay=d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();
  if(sameDay)return '今天 '+p(d.getHours())+':'+p(d.getMinutes());
  if(d.getFullYear()===n.getFullYear())return p(d.getMonth()+1)+'.'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function who(uid){
  if(!uid)return '谁';
  if(ME&&uid===ME.id)return '我';
  return ENC[uid]||'他';
}
function show(v){
  ['list','detail','compose'].forEach(x=>{const el=$(x);if(el)el.style.display=(x===v?'block':'none');});
  $('hdr').style.display=(v==='list'?'block':'none');
  window.scrollTo(0,0);
}

/* [FIX-2] 统一请求封装：非 2xx 一律抛出可读错误 */
async function sb(path,opt){
  const r=await fetch(SB_URL+path,opt||{headers:H});
  const txt=await r.text();
  let data=null;
  if(txt){try{data=JSON.parse(txt);}catch(e){data=txt;}}
  if(!r.ok){
    const msg=(data&&(data.message||data.hint||data.details))||txt||('HTTP '+r.status);
    throw new Error(String(msg).slice(0,200)+' ('+r.status+')');
  }
  return data;
}

/* ================= 登录 ================= */
$('pad').addEventListener('click',e=>{
  const b=e.target.closest('b');if(!b)return;
  const a=b.dataset.act;
  if(a==='clear'){PIN="";drawPin();return;}
  if(a==='del'){PIN=PIN.slice(0,-1);drawPin();return;}
  if(PIN.length>=4)return;
  PIN+=b.textContent.trim();drawPin();
  if(PIN.length===4)setTimeout(doLogin,160);
});
function drawPin(){
  document.querySelectorAll('#pinbox div').forEach((d,i)=>{
    d.textContent=i<PIN.length?'●':'';
    d.classList.toggle('on',i===PIN.length);
  });
}

/* [FIX-3] 登录失败时连 localStorage 一起清，避免刷新后无限重试 */
async function doLogin(){
  if(BUSY)return;
  BUSY=true;
  try{
    const a=await sb('/rest/v1/diary_users?select=id,nickname&password=eq.'+encodeURIComponent(PIN));
    if(!Array.isArray(a)) throw new Error('diary_users 表读不到（检查 RLS）');
    if(!a.length){
      localStorage.removeItem('diary_pin');
      toast('密码不对哦');
      PIN="";drawPin();
      return;
    }
    ME=a[0];
    try{localStorage.setItem('diary_pin',PIN);}catch(e){}
    enter();
  }catch(e){
    localStorage.removeItem('diary_pin');
    toast('登录失败：'+String(e.message||e).slice(0,60));
    PIN="";drawPin();
  }finally{
    BUSY=false;
  }
}
function enter(){
  $('login').style.display='none';
  $('nav').style.display='flex';
  const w=$('who');
  w.textContent=ENC[ME.id]||ME.nickname||'我';
  w.onclick=()=>{
    if(confirm('要换个身份吗？（密码会清掉）')){
      try{localStorage.removeItem('diary_pin');}catch(e){}
      location.reload();
    }
  };
  show('list');
  load();
}

/* ================= 列表 ================= */
/* [FIX-4] render / load 里 ALL、CMTS 全部 Array.isArray 兜底 */
async function load(){
  $('list').innerHTML='<div class="empty">翻着……</div>';
  try{
    const res=await Promise.all([
      sb('/rest/v1/diary_entries?select=id,user_id,title,content,weather,mood,created_at,private&order=created_at.desc&limit=300'),
      sb('/rest/v1/diary_comments?select=id,entry_id,user_id,content,created_at&order=created_at.asc&limit=1000')
    ]);
    ALL=Array.isArray(res[0])?res[0]:[];
    CMTS=Array.isArray(res[1])?res[1]:[];
    render();
  }catch(e){
    console.error(e);
    $('list').innerHTML='<div class="empty">连不上库：'+esc(String(e.message||e).slice(0,80))
      +'<div class="rebtn" onclick="load()">再试一次</div></div>';
  }
}
function render(){
  const box=$('list');
  if(!Array.isArray(ALL))ALL=[];
  if(!Array.isArray(CMTS))CMTS=[];
  if(!ALL.length){
    box.innerHTML='<div class="empty">还没有字。<br>去写第一句吧。</div>';
    return;
  }
  const cnt={};
  CMTS.forEach(c=>{if(c&&c.entry_id)cnt[c.entry_id]=(cnt[c.entry_id]||0)+1;});
  const posts=ALL.filter(it=>{
    if(!it)return false;
    if(it.private&&it.user_id!==ME.id)return false;
    if(FILTER!=='all'&&it.user_id!==FILTER)return false;
    return true;
  });
  if(!posts.length){
    box.innerHTML='<div class="empty">这边还没有字。</div>';
    return;
  }
  box.innerHTML='';
  posts.forEach(it=>{
    const mine=it.user_id===ME.id;
    const title=(it.title&&it.title.trim())?it.title:((it.content||'').slice(0,18)||'（没有名字）');
    const n=cnt[it.id]||0;
    const c=document.createElement('div');
    c.className='card'+(mine?' mine':'');
    c.innerHTML='<div class="meta"><span class="tag '+(mine?'mine':'')+'">'+esc(who(it.user_id))+'</span>'
      +'<span>'+esc(fmt(it.created_at))+'</span>'
      +(it.mood?'<span>'+esc(it.mood)+'</span>':'')
      +'</div><h3>'+esc(title)+'</h3>'
      +'<div class="prev">'+esc((it.content||'').slice(0,150))+'</div>'
      +(n?'<div class="cnum">💬 '+n+' 条回应</div>':'');
    c.onclick=()=>openDetail(it);
    box.appendChild(c);
  });
}

/* ================= 详情 ================= */
function openDetail(it){
  if(!it)return;
  CUR=it;
  $('dTitle').textContent=(it.title&&it.title.trim())?it.title:'（没有名字）';
  const canDel=it.user_id===ME.id;
  $('dMeta').innerHTML='<span>'+esc(who(it.user_id))+'</span>'
    +'<span>'+esc(fmt(it.created_at))+'</span>'
    +(it.mood?'<span>'+esc(it.mood)+'</span>':'')
    +(canDel?'<span class="delbtn" id="delEntry">删掉这篇</span>':'');
  $('dBody').textContent=it.content||'';
  $('cInput').value='';
  if(canDel){
    const d=$('delEntry');
    if(d)d.onclick=ev=>{ev.stopPropagation();delEntry(it);};
  }
  renderCmts();
  show('detail');
}
function renderCmts(){
  const box=$('cmts');
  if(!CUR){box.innerHTML='';return;}
  const list=CMTS.filter(c=>c&&c.entry_id===CUR.id);
  if(!list.length){
    box.innerHTML='<div style="font-size:12.5px;color:#c9a8b6;padding:0 2px 8px;font-family:-apple-system,sans-serif">还没有人回应。</div>';
    return;
  }
  box.innerHTML='';
  list.forEach(c=>{
    const mine=c.user_id===ME.id;
    const d=document.createElement('div');
    d.className='cmt'+(mine?' mine':'');
    d.innerHTML='<div class="ch"><span>'+esc(who(c.user_id))+'</span>'
      +'<span>'+esc(fmt(c.created_at))+'</span>'
      +(mine?'<span class="cdel">删</span>':'')
      +'</div><div class="cb">'+esc(c.content)+'</div>';
    if(mine){
      const del=d.querySelector('.cdel');
      if(del)del.onclick=ev=>{ev.stopPropagation();delCmt(c);};
    }
    box.appendChild(d);
  });
}
async function sendCmt(){
  const v=$('cInput').value.trim();
  if(!v){toast('还没写字呢');return;}
  if(!CUR){toast('先打开一篇');return;}
  const b=$('cSend');
  if(b.disabled)return;
  b.disabled=true;
  try{
    const row=await sb('/rest/v1/diary_comments',{
      method:'POST',
      headers:Object.assign({},H,{'Prefer':'return=representation'}),
      body:JSON.stringify({entry_id:CUR.id,user_id:ME.id,content:v})
    });
    const r=Array.isArray(row)?row[0]:row;
    if(r&&r.id){CMTS.push(r);}
    else{CMTS.push({id:'tmp-'+Date.now(),entry_id:CUR.id,user_id:ME.id,content:v,created_at:new Date().toISOString()});}
    $('cInput').value='';
    renderCmts();
    toast('回上了');
  }catch(e){
    toast('没存上：'+String(e.message||e).slice(0,50));
  }finally{
    b.disabled=false;
  }
}

/* [FIX-5] 删评论：先本地删，失败要还原 */
async function delCmt(c){
  if(!confirm('删掉这条回应？'))return;
  const backup=CMTS.slice();
  CMTS=CMTS.filter(x=>x.id!==c.id);
  renderCmts();
  try{
    await sb('/rest/v1/diary_comments?id=eq.'+encodeURIComponent(c.id),{method:'DELETE',headers:H});
    toast('删了');
  }catch(e){
    CMTS=backup;
    renderCmts();
    toast('删不掉：'+String(e.message||e).slice(0,40));
  }
}

/* [FIX-6] 删日记：先删子表评论，再删主表，避免孤儿数据 */
async function delEntry(it){
  if(!confirm('这篇要删掉吗？删了就找不回来了。'))return;
  try{
    try{
      await sb('/rest/v1/diary_comments?entry_id=eq.'+encodeURIComponent(it.id),{method:'DELETE',headers:H});
    }catch(e){
      console.warn('删评论失败（可能没有 delete 权限），继续删正文',e);
    }
    await sb('/rest/v1/diary_entries?id=eq.'+encodeURIComponent(it.id),{method:'DELETE',headers:H});
    ALL=ALL.filter(x=>x.id!==it.id);
    CMTS=CMTS.filter(c=>c.entry_id!==it.id);
    CUR=null;
    toast('删了');
    show('list');
    render();
  }catch(e){
    toast('删不掉：'+String(e.message||e).slice(0,40));
  }
}

/* ================= 写 ================= */
async function send(){
  const t=$('cTitle').value.trim();
  const body=$('cBody').value.trim();
  if(!body){toast('还没写字呢');return;}
  const btn=$('sendBtn');
  if(btn.disabled)return;
  btn.disabled=true;
  const old=btn.textContent;
  btn.textContent='写着……';
  try{
    await sb('/rest/v1/diary_entries',{
      method:'POST',
      headers:Object.assign({},H,{'Prefer':'return=minimal'}),
      body:JSON.stringify({user_id:ME.id,title:t,content:body})
    });
    $('cTitle').value='';
    $('cBody').value='';
    toast('写进去了');
    document.querySelectorAll('nav div').forEach(d=>d.classList.toggle('on',d.dataset.tab==='list'));
    show('list');
    await load();
  }catch(e){
    toast('没存上：'+String(e.message||e).slice(0,50));
  }finally{
    btn.disabled=false;
    btn.textContent=old;
  }
}

$('backBtn').onclick=()=>{show('list');render();};
$('backBtn2').onclick=()=>{show('list');};

$('nav').addEventListener('click',e=>{

<script>
(function(){
  var btn=document.getElementById('upd');
  if(!btn) return;
  var busy=false;
  btn.addEventListener('click', async function(){
    if(busy) return; busy=true;
    btn.textContent='更新中';
    try{
      if('serviceWorker' in navigator){
        var regs=await navigator.serviceWorker.getRegistrations();
        for(var i=0;i<regs.length;i++){
          try{ await regs[i].update(); }catch(e){}
          if(regs[i].waiting) regs[i].waiting.postMessage({type:'SKIP_WAITING'});
        }
      }
      if('caches' in window){
        var ks=await caches.keys();
        await Promise.all(ks.map(function(k){ return caches.delete(k); }));
      }
    }catch(e){}
    location.replace(location.pathname+'?u='+Date.now());
  });
})();
</script>
